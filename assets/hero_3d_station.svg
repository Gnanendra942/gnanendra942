<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Obsidian Base Gradient -->
    <linearGradient id="hero-obsidian-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="hero-title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="75%" stop-color="#7AF2FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Border Stroke Gradient -->
    <linearGradient id="hero-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .font-display { font-family: 'Inter', 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'IBM Plex Mono', Menlo, monospace; }
      @keyframes pulseLight {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 0.35; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      .anim-pulse { animation: pulseLight 4s infinite ease-in-out; }
      .anim-float { animation: floatSlow 3s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="1200" height="320" rx="16" fill="url(#hero-obsidian-bg)" stroke="url(#hero-border-grad)" stroke-width="1.4"/>

  <!-- Background Cyber Grid & Dots -->
  <g opacity="0.08" stroke="#38BDF8" stroke-width="0.8">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="1000" y1="0" x2="1000" y2="320"/>
  </g>

  <!-- Ambient Glowing Orbs -->
  <circle cx="160" cy="100" r="120" fill="#38BDF8" class="anim-pulse" filter="url(#soft-glow)"/>
  <circle cx="1020" cy="180" r="140" fill="#818CF8" class="anim-pulse" filter="url(#soft-glow)"/>

  <!-- ================= LEFT: Profile & Bio Intro ================= -->
  <g transform="translate(60, 50)">
    <!-- Status Pill -->
    <g transform="translate(0, 0)">
      <rect width="260" height="26" rx="13" fill="#141C2E" stroke="#1E293B" stroke-width="1"/>
      <circle cx="13" cy="13" r="4" fill="#10B981"/>
      <text x="26" y="17" class="font-mono" font-size="10.5" font-weight="700" fill="#10B981" letter-spacing="0.5">COMPUTER SCIENCE · VEL TECH</text>
    </g>

    <!-- Main Title & Name -->
    <text x="0" y="70" class="font-display" font-size="36" font-weight="800" fill="url(#hero-title-grad)" letter-spacing="-0.5">
      Chowreddygari Gnanendra Reddy
    </text>

    <!-- Subtitle / Roles -->
    <text x="0" y="104" class="font-display" font-size="16" font-weight="600" fill="#94A3B8">
      Java Software Developer <tspan fill="#38BDF8">·</tspan> Full-Stack Web Craftsman <tspan fill="#818CF8">·</tspan> Smart IoT Engineer
    </text>

    <!-- Micro Metadata Chips -->
    <g transform="translate(0, 136)">
      <!-- VTU Chip -->
      <rect width="130" height="28" rx="6" fill="#141C2E" stroke="#1E293B" stroke-width="1"/>
      <text x="12" y="18" class="font-mono" font-size="10.5" fill="#94A3B8">ID: <tspan fill="#38BDF8" font-weight="700">VTU29661</tspan></text>

      <!-- CGPA Chip -->
      <g transform="translate(142, 0)">
        <rect width="130" height="28" rx="6" fill="#141C2E" stroke="#1E293B" stroke-width="1"/>
        <text x="12" y="18" class="font-mono" font-size="10.5" fill="#94A3B8">CGPA: <tspan fill="#F59E0B" font-weight="700">8.6 / 10</tspan></text>
      </g>

      <!-- Location Chip -->
      <g transform="translate(284, 0)">
        <rect width="150" height="28" rx="6" fill="#141C2E" stroke="#1E293B" stroke-width="1"/>
        <text x="12" y="18" class="font-mono" font-size="10.5" fill="#94A3B8">📍 <tspan fill="#F8FAFC" font-weight="600">Chennai, India</tspan></text>
      </g>
    </g>

    <!-- Core Philosophy Quote -->
    <text x="0" y="202" class="font-mono" font-size="11.5" fill="#64748B">
      &gt; "Architecting clean, performant Java backends, reactive web UIs, and smart embedded IoT systems."
    </text>
  </g>

  <!-- ================= RIGHT: 3D Dev Station Visual Isometric Terminal ================= -->
  <g transform="translate(850, 42)">
    <g class="anim-float">
    <!-- Outer Terminal Window -->
    <rect width="290" height="236" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5" filter="url(#soft-glow)"/>
    
    <!-- Titlebar -->
    <rect width="290" height="34" rx="14" fill="#141C2E"/>
    <rect y="20" width="290" height="14" fill="#141C2E"/>
    <circle cx="18" cy="17" r="4.5" fill="#EF4444"/>
    <circle cx="34" cy="17" r="4.5" fill="#F59E0B"/>
    <circle cx="50" cy="17" r="4.5" fill="#10B981"/>
    <text x="145" y="21" text-anchor="middle" class="font-mono" font-size="10" font-weight="600" fill="#94A3B8">gnanendra@dev-station:~</text>

    <!-- Terminal Content Area -->
    <g transform="translate(16, 48)">
      <!-- Line 1: Java Env -->
      <text x="0" y="16" class="font-mono" font-size="10" fill="#38BDF8">➜ <tspan fill="#F8FAFC">java --version</tspan></text>
      <text x="0" y="32" class="font-mono" font-size="9.5" fill="#94A3B8">OpenJDK 21 · Core &amp; DSA Suite</text>

      <!-- Line 2: React & Web -->
      <text x="0" y="58" class="font-mono" font-size="10" fill="#818CF8">➜ <tspan fill="#F8FAFC">npm run build:web</tspan></text>
      <text x="0" y="74" class="font-mono" font-size="9.5" fill="#10B981">✓ React 19 + Tailwind CSS [Optimized]</text>

      <!-- Line 3: IoT Hardware Telemetry -->
      <text x="0" y="100" class="font-mono" font-size="10" fill="#10B981">➜ <tspan fill="#F8FAFC">arduino-cli compile --board uno</tspan></text>
      <text x="0" y="116" class="font-mono" font-size="9.5" fill="#F59E0B">● Pulse &amp; Curve Safety Telemetry: LIVE</text>

      <!-- Live Metric Indicator Bar -->
      <rect y="132" width="258" height="32" rx="6" fill="#141C2E" stroke="#1E293B" stroke-width="1"/>
      <circle cx="16" cy="148" r="4" fill="#10B981"/>
      <text x="28" y="152" class="font-mono" font-size="10" font-weight="600" fill="#F8FAFC">SYSTEM READY</text>
      <text x="246" y="152" text-anchor="end" class="font-mono" font-size="9.5" font-weight="700" fill="#38BDF8">100% HEALTH</text>
    </g>
  </g>
  </g>
</svg>
