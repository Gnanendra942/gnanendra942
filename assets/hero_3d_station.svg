<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Obsidian Deep Space Gradient -->
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="40%" stop-color="#0B0F19"/>
      <stop offset="80%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#070B14"/>
    </linearGradient>

    <!-- Animated Border Gradient Beam -->
    <linearGradient id="hero-border-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#38BDF8;#818CF8;#10B981;#38BDF8" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#818CF8;#10B981;#38BDF8;#818CF8" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Shimmering Name Gradient -->
    <linearGradient id="shimmer-name" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF">
        <animate attributeName="stop-color" values="#FFFFFF;#7AF2FF;#FFFFFF;#F8FAFC;#FFFFFF" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#7AF2FF">
        <animate attributeName="stop-color" values="#7AF2FF;#FFFFFF;#38BDF8;#7AF2FF" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#818CF8;#FFFFFF;#38BDF8" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Laser Scan Beam Gradient -->
    <linearGradient id="scan-laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#818CF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
    </filter>

    <style>
      .font-display { font-family: 'Inter', 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'IBM Plex Mono', Menlo, monospace; }
      
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes pulseOrbs {
        0%, 100% { opacity: 0.12; transform: scale(1); }
        50% { opacity: 0.28; transform: scale(1.1); }
      }
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes starTwinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 0.9; transform: scale(1.3); }
      }
      @keyframes waveBar1 { 0%, 100% { height: 6px; y: 154px; } 50% { height: 18px; y: 142px; } }
      @keyframes waveBar2 { 0%, 100% { height: 16px; y: 144px; } 50% { height: 8px; y: 152px; } }
      @keyframes waveBar3 { 0%, 100% { height: 10px; y: 150px; } 50% { height: 22px; y: 138px; } }
      @keyframes waveBar4 { 0%, 100% { height: 20px; y: 140px; } 50% { height: 12px; y: 148px; } }

      .anim-float { animation: floatSlow 4s infinite ease-in-out; }
      .anim-pulse-orb { animation: pulseOrbs 5s infinite ease-in-out; transform-origin: center; }
      .anim-blink { animation: blinkCursor 0.9s infinite step-start; }
      .star-1 { animation: starTwinkle 3s infinite ease-in-out; }
      .star-2 { animation: starTwinkle 4.5s infinite ease-in-out 1s; }
      .star-3 { animation: starTwinkle 2.5s infinite ease-in-out 0.5s; }
      .bar-1 { animation: waveBar1 1.2s infinite ease-in-out; }
      .bar-2 { animation: waveBar2 0.9s infinite ease-in-out 0.2s; }
      .bar-3 { animation: waveBar3 1.4s infinite ease-in-out 0.4s; }
      .bar-4 { animation: waveBar4 1.1s infinite ease-in-out 0.1s; }
    </style>
  </defs>

  <!-- Container Box with Rounded Chamfered Corners -->
  <rect width="1200" height="340" rx="16" fill="url(#hero-bg)" stroke="url(#hero-border-beam)" stroke-width="1.6"/>

  <!-- Background Cyber Perspective Grid -->
  <g opacity="0.07" stroke="#38BDF8" stroke-width="0.8">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="340"/>
    <line x1="300" y1="0" x2="300" y2="340"/>
    <line x1="450" y1="0" x2="450" y2="340"/>
    <line x1="600" y1="0" x2="600" y2="340"/>
    <line x1="750" y1="0" x2="750" y2="340"/>
    <line x1="900" y1="0" x2="900" y2="340"/>
    <line x1="1050" y1="0" x2="1050" y2="340"/>
  </g>

  <!-- Laser Scan Beam Sweeping Vertically -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#scan-laser)" stroke-width="1.8">
    <animate attributeName="y1" values="0;340;0" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="0;340;0" dur="9s" repeatCount="indefinite"/>
  </line>

  <!-- Ambient Glowing Orbs -->
  <circle cx="160" cy="110" r="130" fill="#38BDF8" class="anim-pulse-orb" filter="url(#soft-blur)"/>
  <circle cx="1040" cy="200" r="150" fill="#818CF8" class="anim-pulse-orb" filter="url(#soft-blur)"/>
  <circle cx="650" cy="60" r="90" fill="#10B981" class="anim-pulse-orb" filter="url(#soft-blur)" opacity="0.1"/>

  <!-- Twinkling Micro Constellation Stars -->
  <circle cx="120" cy="80" r="1.5" fill="#38BDF8" class="star-1"/>
  <circle cx="280" cy="45" r="2" fill="#FFFFFF" class="star-2"/>
  <circle cx="450" cy="90" r="1.5" fill="#7AF2FF" class="star-3"/>
  <circle cx="720" cy="40" r="2" fill="#818CF8" class="star-1"/>
  <circle cx="830" cy="95" r="1.5" fill="#FFFFFF" class="star-2"/>
  <circle cx="1120" cy="65" r="2" fill="#38BDF8" class="star-3"/>
  <circle cx="340" cy="310" r="1.5" fill="#818CF8" class="star-2"/>
  <circle cx="670" cy="290" r="1.8" fill="#10B981" class="star-1"/>

  <!-- ================= LEFT: Profile & Bio Intro ================= -->
  <g transform="translate(60, 48)">
    <!-- Animated Status Pill -->
    <g transform="translate(0, 0)">
      <rect width="280" height="26" rx="13" fill="#141C2E" stroke="#1E293B" stroke-width="1"/>
      
      <!-- Pulsing Radar Beacon -->
      <circle cx="14" cy="13" r="6" fill="#10B981" opacity="0.3">
        <animate attributeName="r" values="3;9;3" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0;0.7" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="14" cy="13" r="3.5" fill="#10B981"/>
      
      <text x="28" y="17" class="font-mono" font-size="10.5" font-weight="700" fill="#10B981" letter-spacing="0.5">ACTIVE CSE UNDERGRADUATE</text>
      <text x="220" y="17" class="font-mono" font-size="10" font-weight="600" fill="#38BDF8">· VEL TECH</text>
    </g>

    <!-- Main Title & Name with Shimmering Chromatic Gradient -->
    <text x="0" y="74" class="font-display" font-size="37" font-weight="800" fill="url(#shimmer-name)" letter-spacing="-0.5" filter="url(#neon-glow)">
      Chowreddygari Gnanendra Reddy
    </text>

    <!-- Subtitle / Multi-Disciplinary Roles -->
    <g transform="translate(0, 110)">
      <text class="font-display" font-size="16" font-weight="600" fill="#F8FAFC">
        Java Software Developer 
        <tspan fill="#38BDF8"> ✦ </tspan> 
        <tspan fill="#38BDF8">Full-Stack Web Craftsman</tspan>
        <tspan fill="#818CF8"> ✦ </tspan> 
        <tspan fill="#10B981">Smart IoT Engineer</tspan>
      </text>
    </g>

    <!-- Micro Metadata Chips -->
    <g transform="translate(0, 144)">
      <!-- VTU ID Chip -->
      <g>
        <rect width="135" height="30" rx="7" fill="#141C2E" stroke="#1E293B" stroke-width="1.1"/>
        <circle cx="14" cy="15" r="3" fill="#38BDF8"/>
        <text x="24" y="19" class="font-mono" font-size="11" fill="#94A3B8">ID: <tspan fill="#38BDF8" font-weight="700">VTU29661</tspan></text>
      </g>

      <!-- Batch Chip -->
      <g transform="translate(148, 0)">
        <rect width="135" height="30" rx="7" fill="#141C2E" stroke="#1E293B" stroke-width="1.1"/>
        <circle cx="14" cy="15" r="3" fill="#F59E0B"/>
        <text x="24" y="19" class="font-mono" font-size="11" fill="#94A3B8">Batch: <tspan fill="#F59E0B" font-weight="700">2024–2028</tspan></text>
      </g>

      <!-- Location Chip -->
      <g transform="translate(296, 0)">
        <rect width="165" height="30" rx="7" fill="#141C2E" stroke="#1E293B" stroke-width="1.1"/>
        <text x="14" y="19" class="font-mono" font-size="11" fill="#94A3B8">📍 <tspan fill="#F8FAFC" font-weight="600">Chennai, India</tspan></text>
      </g>
    </g>

    <!-- Core Philosophy Quote -->
    <g transform="translate(0, 214)">
      <rect x="0" y="0" width="3" height="36" fill="#38BDF8" rx="1.5"/>
      <text x="14" y="15" class="font-mono" font-size="12" fill="#E2E8F0">
        &gt; "Architecting clean, performant Java backends, reactive web UIs,"
      </text>
      <text x="14" y="32" class="font-mono" font-size="12" fill="#94A3B8">
        &gt; "and smart embedded IoT hardware telemetry with zero compromise."
      </text>
    </g>
  </g>

  <!-- ================= RIGHT: 3D Dev Station Visual Isometric Terminal ================= -->
  <g transform="translate(845, 42)" class="anim-float">
    <!-- Outer Terminal Window with Neon Glow -->
    <rect width="300" height="256" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5" filter="url(#neon-glow)"/>
    <rect width="300" height="256" rx="14" fill="#0B132B" opacity="0.95"/>
    
    <!-- Titlebar -->
    <rect width="300" height="36" rx="14" fill="#141C2E"/>
    <rect y="22" width="300" height="14" fill="#141C2E"/>
    
    <!-- Window Control Buttons -->
    <circle cx="20" cy="18" r="5" fill="#EF4444"/>
    <circle cx="36" cy="18" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="18" r="5" fill="#10B981"/>
    
    <!-- Terminal Title -->
    <text x="150" y="22" text-anchor="middle" class="font-mono" font-size="10.5" font-weight="600" fill="#94A3B8">gnanendra@dev-station:~</text>

    <!-- Terminal Body -->
    <g transform="translate(18, 52)">
      <!-- Line 1: Java Env -->
      <text x="0" y="14" class="font-mono" font-size="10.5" fill="#38BDF8">➜ <tspan fill="#F8FAFC">java -jar dsa-core.jar</tspan></text>
      <text x="0" y="30" class="font-mono" font-size="10" fill="#10B981">✓ OpenJDK 21 · ACS Test Suite [PASS]</text>

      <!-- Line 2: React Web App -->
      <text x="0" y="56" class="font-mono" font-size="10.5" fill="#818CF8">➜ <tspan fill="#F8FAFC">npm run deploy:web</tspan></text>
      <text x="0" y="72" class="font-mono" font-size="10" fill="#7AF2FF">⚡ React 19 + Tailwind · 60 FPS Fluid</text>

      <!-- Line 3: IoT Hardware Telemetry -->
      <text x="0" y="98" class="font-mono" font-size="10.5" fill="#10B981">➜ <tspan fill="#F8FAFC">arduino-cli telemetry --live</tspan></text>
      <text x="0" y="114" class="font-mono" font-size="10" fill="#F59E0B">● Pulse Sensor &amp; Road Safety: STREAMING</text>

      <!-- Live Interactive Prompt with Blinking Cursor -->
      <g transform="translate(0, 134)">
        <text x="0" y="10" class="font-mono" font-size="10.5" fill="#F8FAFC">➜ <tspan fill="#38BDF8">status</tspan> <tspan class="anim-blink" fill="#38BDF8" font-weight="900">█</tspan></text>
      </g>

      <!-- Live Metric Indicator Bar with Animated Telemetry Waves -->
      <g transform="translate(0, 150)">
        <rect width="264" height="36" rx="7" fill="#141C2E" stroke="#1E293B" stroke-width="1"/>
        
        <!-- Live Status Light -->
        <circle cx="16" cy="18" r="4" fill="#10B981"/>
        <circle cx="16" cy="18" r="7" fill="#10B981" opacity="0.3">
          <animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2s" repeatCount="indefinite"/>
        </circle>
        
        <text x="28" y="22" class="font-mono" font-size="10" font-weight="700" fill="#F8FAFC">SYSTEM ONLINE</text>
        
        <!-- Animated Audio/Telemetry Signal Bars -->
        <g transform="translate(150, -135)">
          <rect x="0" y="150" width="3" height="10" rx="1.5" fill="#38BDF8" class="bar-1"/>
          <rect x="6" y="144" width="3" height="16" rx="1.5" fill="#38BDF8" class="bar-2"/>
          <rect x="12" y="148" width="3" height="12" rx="1.5" fill="#818CF8" class="bar-3"/>
          <rect x="18" y="140" width="3" height="20" rx="1.5" fill="#10B981" class="bar-4"/>
          <rect x="24" y="146" width="3" height="14" rx="1.5" fill="#38BDF8" class="bar-2"/>
        </g>

        <text x="254" y="22" text-anchor="end" class="font-mono" font-size="10" font-weight="700" fill="#10B981">100%</text>
      </g>
    </g>
  </g>
</svg>
