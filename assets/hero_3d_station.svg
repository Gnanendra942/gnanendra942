<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Deep Space Obsidian Gradient -->
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="30%" stop-color="#0B1224"/>
      <stop offset="70%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <!-- Animated High-Voltage Cyber Neon Aurora Border Beam -->
    <linearGradient id="hero-border-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF">
        <animate attributeName="stop-color" values="#00F0FF;#8B5CF6;#10B981;#F59E0B;#00F0FF" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="35%" stop-color="#1E293B" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#10B981;#F59E0B;#00F0FF;#8B5CF6" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#F59E0B;#00F0FF;#8B5CF6;#10B981" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Shimmering Chromatic Name Gradient -->
    <linearGradient id="shimmer-name" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF">
        <animate attributeName="stop-color" values="#FFFFFF;#7AF2FF;#D8B4FE;#FFFFFF" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#7AF2FF">
        <animate attributeName="stop-color" values="#7AF2FF;#D8B4FE;#FFFFFF;#7AF2FF" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#D8B4FE">
        <animate attributeName="stop-color" values="#D8B4FE;#FFFFFF;#7AF2FF;#D8B4FE" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Sweeping Laser Scan Beam Gradient -->
    <linearGradient id="scan-laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00F0FF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#A855F7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>

    <!-- Fluid Cyber Wave Gradients -->
    <linearGradient id="wave-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.25"/>
    </linearGradient>

    <linearGradient id="wave-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.18"/>
    </linearGradient>

    <linearGradient id="wave-grad-3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#060913" stop-opacity="0.12"/>
    </linearGradient>

    <!-- High-Impact Neon Bloom Filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
    </filter>

    <style>
      .font-display { font-family: 'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'IBM Plex Mono', Menlo, Consolas, monospace; }

      @keyframes pulseOrbs {
        0%, 100% { opacity: 0.12; transform: scale(1); }
        50% { opacity: 0.28; transform: scale(1.15); }
      }
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes starTwinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 0.95; transform: scale(1.3); }
      }
      @keyframes waveSlide1 {
        0% { transform: translateX(0); }
        50% { transform: translateX(-50px); }
        100% { transform: translateX(0); }
      }
      @keyframes waveSlide2 {
        0% { transform: translateX(-40px); }
        50% { transform: translateX(30px); }
        100% { transform: translateX(-40px); }
      }
      @keyframes cycleRole1 {
        0%, 20% { opacity: 1; transform: translateY(0); }
        25%, 100% { opacity: 0; transform: translateY(-8px); }
      }
      @keyframes cycleRole2 {
        0%, 24% { opacity: 0; transform: translateY(8px); }
        26%, 46% { opacity: 1; transform: translateY(0); }
        51%, 100% { opacity: 0; transform: translateY(-8px); }
      }
      @keyframes cycleRole3 {
        0%, 49% { opacity: 0; transform: translateY(8px); }
        51%, 71% { opacity: 1; transform: translateY(0); }
        76%, 100% { opacity: 0; transform: translateY(-8px); }
      }
      @keyframes cycleRole4 {
        0%, 74% { opacity: 0; transform: translateY(8px); }
        76%, 96% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(-8px); }
      }

      .anim-pulse-orb { animation: pulseOrbs 5.5s infinite ease-in-out; transform-origin: center; }
      .anim-cursor { animation: blinkCursor 0.8s infinite; }
      .anim-wave-1 { animation: waveSlide1 8s ease-in-out infinite; }
      .anim-wave-2 { animation: waveSlide2 10s ease-in-out infinite; }
      .star-1 { animation: starTwinkle 3s infinite ease-in-out; }
      .star-2 { animation: starTwinkle 4.5s infinite ease-in-out 1s; }
      .star-3 { animation: starTwinkle 2.5s infinite ease-in-out 0.5s; }
      .role-1 { animation: cycleRole1 12s infinite; }
      .role-2 { animation: cycleRole2 12s infinite; }
      .role-3 { animation: cycleRole3 12s infinite; }
      .role-4 { animation: cycleRole4 12s infinite; }
    </style>
  </defs>

  <!-- Container Box with Glowing Border -->
  <rect width="1200" height="320" rx="16" fill="url(#hero-bg)" stroke="url(#hero-border-beam)" stroke-width="1.8"/>

  <!-- Perspective Cyber Grid -->
  <g opacity="0.07" stroke="#00F0FF" stroke-width="0.9">
    <line x1="0" y1="55" x2="1200" y2="55"/>
    <line x1="0" y1="110" x2="1200" y2="110"/>
    <line x1="0" y1="165" x2="1200" y2="165"/>
    <line x1="0" y1="220" x2="1200" y2="220"/>
    <line x1="0" y1="275" x2="1200" y2="275"/>
    <line x1="100" y1="0" x2="100" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="500" y1="0" x2="500" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="700" y1="0" x2="700" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="900" y1="0" x2="900" y2="320"/>
    <line x1="1000" y1="0" x2="1000" y2="320"/>
    <line x1="1100" y1="0" x2="1100" y2="320"/>
  </g>

  <!-- Sweeping Laser Scan Beam -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#scan-laser)" stroke-width="2.2">
    <animate attributeName="y1" values="0;320;0" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="0;320;0" dur="8s" repeatCount="indefinite"/>
  </line>

  <!-- Ambient Glowing Orbs -->
  <circle cx="160" cy="80" r="150" fill="#00F0FF" class="anim-pulse-orb" filter="url(#soft-blur)"/>
  <circle cx="1040" cy="110" r="160" fill="#8B5CF6" class="anim-pulse-orb" filter="url(#soft-blur)"/>
  <circle cx="600" cy="50" r="110" fill="#10B981" class="anim-pulse-orb" filter="url(#soft-blur)" opacity="0.10"/>
  <circle cx="600" cy="280" r="140" fill="#A855F7" class="anim-pulse-orb" filter="url(#soft-blur)" opacity="0.12"/>

  <!-- Twinkling Constellation Stars -->
  <circle cx="95" cy="55" r="1.8" fill="#00F0FF" class="star-1"/>
  <circle cx="240" cy="30" r="2.2" fill="#F8FAFC" class="star-2"/>
  <circle cx="380" cy="65" r="1.8" fill="#7AF2FF" class="star-3"/>
  <circle cx="820" cy="35" r="2.2" fill="#A855F7" class="star-1"/>
  <circle cx="960" cy="70" r="1.8" fill="#F8FAFC" class="star-2"/>
  <circle cx="1120" cy="40" r="2.2" fill="#00F0FF" class="star-3"/>
  <circle cx="140" cy="270" r="1.8" fill="#8B5CF6" class="star-2"/>
  <circle cx="1060" cy="260" r="2" fill="#10B981" class="star-1"/>

  <!-- Fluid Animated Cyber Waves at Base -->
  <g class="anim-wave-2">
    <path d="M-80,245 C160,215 380,275 630,235 C880,200 1070,270 1320,235 L1320,320 L-80,320 Z" fill="url(#wave-grad-3)"/>
  </g>
  <g class="anim-wave-1">
    <path d="M-60,260 C190,235 410,285 670,250 C920,220 1120,280 1370,255 L1370,320 L-60,320 Z" fill="url(#wave-grad-2)"/>
  </g>
  <g class="anim-wave-2">
    <path d="M-40,275 C230,250 450,295 710,265 C950,235 1160,290 1420,270 L1420,320 L-40,320 Z" fill="url(#wave-grad-1)"/>
  </g>

  <!-- ================= CENTERED MASTER DEVELOPER IDENTITY STACK ================= -->
  <g transform="translate(600, 24)" text-anchor="middle">

    <!-- 01. Animated Status Pill (Pulsing Radar Beacon) -->
    <g transform="translate(0, 0)">
      <rect x="-170" y="0" width="340" height="26" rx="13" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
      <circle cx="-148" cy="13" r="6" fill="#10B981" opacity="0.4">
        <animate attributeName="r" values="3;9;3" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-148" cy="13" r="3.5" fill="#10B981"/>
      <text x="-132" y="17" text-anchor="start" class="font-mono" font-size="10.5" font-weight="700" fill="#10B981" letter-spacing="0.5">ACTIVE CSE UNDERGRADUATE</text>
      <text x="145" y="17" text-anchor="end" class="font-mono" font-size="10" font-weight="600" fill="#00F0FF">· VEL TECH</text>
    </g>

    <!-- 02. Shimmering Chromatic Hero Name -->
    <text x="0" y="60" class="font-display" font-size="39" font-weight="900" fill="url(#shimmer-name)" letter-spacing="-0.3" filter="url(#neon-glow)">
      Chowreddygari Gnanendra Reddy
    </text>

    <!-- 03. Multi-Disciplinary Title Subheading -->
    <g transform="translate(0, 87)">
      <text x="0" y="0" class="font-display" font-size="15" font-weight="600" fill="#F8FAFC">
        Java Software Architect 
        <tspan fill="#00F0FF"> ✦ </tspan> 
        <tspan fill="#7AF2FF">Full-Stack Web Craftsman</tspan>
        <tspan fill="#A855F7"> ✦ </tspan> 
        <tspan fill="#10B981">Smart IoT Systems Engineer</tspan>
      </text>
    </g>

    <!-- 04. Dynamic Typing Cycling Role Banner (with λ & blinking neon cursor) -->
    <g transform="translate(0, 108)">
      <rect x="-270" y="0" width="540" height="30" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" opacity="0.95"/>
      <text x="-250" y="20" text-anchor="start" class="font-mono" font-size="13" font-weight="800" fill="#94A3B8">λ</text>
      
      <!-- Role 1: Full-Stack -->
      <g class="role-1">
        <text x="-230" y="19.5" text-anchor="start" class="font-mono" font-size="12" font-weight="700" fill="#00F0FF">
          Full-Stack Architect · React 19, Next.js &amp; Node.js
        </text>
      </g>
      
      <!-- Role 2: Java Core -->
      <g class="role-2">
        <text x="-230" y="19.5" text-anchor="start" class="font-mono" font-size="12" font-weight="700" fill="#F59E0B">
          Core Java 21 · Applied OOP &amp; Algorithmic Problem Solving
        </text>
      </g>
      
      <!-- Role 3: IoT Hardware -->
      <g class="role-3">
        <text x="-230" y="19.5" text-anchor="start" class="font-mono" font-size="12" font-weight="700" fill="#10B981">
          Smart IoT Hardware Telemetry &amp; Cyber-Physical Networks
        </text>
      </g>

      <!-- Role 4: Open Source -->
      <g class="role-4">
        <text x="-230" y="19.5" text-anchor="start" class="font-mono" font-size="12" font-weight="700" fill="#A855F7">
          Scalable Web Systems &amp; High-Performance Architectures
        </text>
      </g>

      <!-- Blinking Neon Cursor -->
      <rect x="246" y="6.5" width="7" height="17" rx="1.5" fill="#00F0FF" class="anim-cursor"/>
    </g>

    <!-- 05. 4 Verified Quick Credentials Pills -->
    <g transform="translate(0, 153)">
      <!-- Pill 1: Vel Tech -->
      <g transform="translate(-282, 0)">
        <rect width="134" height="26" rx="6" fill="#0F172A" stroke="#0284C7" stroke-width="1"/>
        <text x="67" y="17" text-anchor="middle" class="font-mono" font-size="10" font-weight="600" fill="#00F0FF">🎓 VEL TECH '28</text>
      </g>

      <!-- Pill 2: Java 21 -->
      <g transform="translate(-138, 0)">
        <rect width="134" height="26" rx="6" fill="#0F172A" stroke="#D97706" stroke-width="1"/>
        <text x="67" y="17" text-anchor="middle" class="font-mono" font-size="10" font-weight="600" fill="#F59E0B">☕ JAVA 21 &amp; OOP</text>
      </g>

      <!-- Pill 3: React 19 -->
      <g transform="translate(6, 0)">
        <rect width="134" height="26" rx="6" fill="#0F172A" stroke="#7C3AED" stroke-width="1"/>
        <text x="67" y="17" text-anchor="middle" class="font-mono" font-size="10" font-weight="600" fill="#A855F7">⚛️ REACT 19 &amp; NEXT</text>
      </g>

      <!-- Pill 4: IoT Telemetry -->
      <g transform="translate(150, 0)">
        <rect width="134" height="26" rx="6" fill="#0F172A" stroke="#059669" stroke-width="1"/>
        <text x="67" y="17" text-anchor="middle" class="font-mono" font-size="10" font-weight="600" fill="#10B981">⚡ IOT TELEMETRY</text>
      </g>
    </g>

    <!-- 06. Metadata Chips (ID, Batch, Location) -->
    <g transform="translate(0, 192)">
      <!-- VTU ID Chip -->
      <g transform="translate(-250, 0)">
        <rect width="150" height="26" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1.1"/>
        <circle cx="16" cy="13" r="3.5" fill="#00F0FF"/>
        <text x="28" y="17" text-anchor="start" class="font-mono" font-size="10.5" fill="#94A3B8">ID: <tspan fill="#00F0FF" font-weight="700">VTU29661</tspan></text>
      </g>

      <!-- Batch Chip -->
      <g transform="translate(-85, 0)">
        <rect width="155" height="26" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1.1"/>
        <circle cx="16" cy="13" r="3.5" fill="#F59E0B"/>
        <text x="28" y="17" text-anchor="start" class="font-mono" font-size="10.5" fill="#94A3B8">Batch: <tspan fill="#F59E0B" font-weight="700">2024–2028</tspan></text>
      </g>

      <!-- Location Chip -->
      <g transform="translate(85, 0)">
        <rect width="168" height="26" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1.1"/>
        <text x="14" y="17" text-anchor="start" class="font-mono" font-size="10.5" fill="#94A3B8">📍 <tspan fill="#F8FAFC" font-weight="600">Chennai, India</tspan></text>
      </g>
    </g>

    <!-- 07. Core Philosophy Quote -->
    <g transform="translate(0, 238)">
      <text x="0" y="15" text-anchor="middle" class="font-mono" font-size="11.5" fill="#CBD5E1">
        &gt; "Architecting clean, performant Java backends, reactive web UIs, and smart embedded IoT telemetry."
      </text>
      <text x="0" y="33" text-anchor="middle" class="font-mono" font-size="10.5" fill="#00F0FF" opacity="0.95">
        &gt; "Simplicity and precision in code; resilience, speed, and elegance in architecture."
      </text>
    </g>

  </g>
</svg>
