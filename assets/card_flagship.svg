<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="100%" height="100%">
  <defs>
    <!-- Dark Surface Gradient -->
    <linearGradient id="bg-flagship" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>

    <!-- Animated Border Glow Beam -->
    <linearGradient id="flagship-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05A2B3">
        <animate attributeName="stop-color" values="#05A2B3;#3FB950;#58A6FF;#8957E5;#05A2B3" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#30363D" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3FB950">
        <animate attributeName="stop-color" values="#3FB950;#58A6FF;#8957E5;#05A2B3;#3FB950" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Shimmering Title Gradient -->
    <linearGradient id="flagship-title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF">
        <animate attributeName="stop-color" values="#FFFFFF;#67E8F9;#FFFFFF" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#67E8F9">
        <animate attributeName="stop-color" values="#67E8F9;#FFFFFF;#05A2B3;#67E8F9" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#05A2B3">
        <animate attributeName="stop-color" values="#05A2B3;#38BDF8;#FFFFFF;#05A2B3" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Spin Orbit Gradient -->
    <linearGradient id="teal-spin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05A2B3"/>
      <stop offset="50%" stop-color="#3FB950"/>
      <stop offset="100%" stop-color="#58A6FF"/>
    </linearGradient>

    <filter id="f-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .font-display { font-family: 'Inter', 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'IBM Plex Mono', Menlo, monospace; }
      
      @keyframes floatIcon {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-4px) rotate(2deg); }
      }
      @keyframes radarPulse {
        0% { r: 3.5px; opacity: 1; }
        100% { r: 10px; opacity: 0; }
      }
      @keyframes spinRing {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .anim-icon { animation: floatIcon 3.5s infinite ease-in-out; }
      .anim-beacon { animation: radarPulse 2s infinite ease-out; }
      .anim-spin { animation: spinRing 10s linear infinite; transform-origin: 36px 36px; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="1200" height="210" rx="14" fill="url(#bg-flagship)" stroke="url(#flagship-beam)" stroke-width="1.6"/>
  <rect x="0" y="0" width="1200" height="3" rx="1.5" fill="#05A2B3"/>

  <!-- Left Icon Frame with Glowing Ambient -->
  <g transform="translate(36, 42)">
    <circle cx="36" cy="36" r="38" fill="none" stroke="url(#teal-spin-grad)" stroke-width="1.8" stroke-dasharray="6 4" class="anim-spin"/>
    <rect width="72" height="72" rx="14" fill="#161B22" stroke="#30363D" stroke-width="1.2" filter="url(#f-glow)"/>
    <g transform="translate(36, 48)">
      <g class="anim-icon">
        <text text-anchor="middle" font-size="34">🛍️</text>
      </g>
    </g>
  </g>

  <!-- Title & Description (Center) -->
  <g transform="translate(136, 32)">
    <!-- Status Tag Pill -->
    <g transform="translate(0, 0)">
      <rect width="320" height="24" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <circle cx="14" cy="12" r="3.5" fill="#10B981"/>
      <circle cx="14" cy="12" r="3.5" fill="none" stroke="#10B981" stroke-width="1.2" class="anim-beacon"/>
      <text x="28" y="16" class="font-mono" font-size="10.5" font-weight="700" fill="#10B981">● FEATURED PROJECT #2</text>
      <text x="210" y="16" class="font-mono" font-size="10" font-weight="700" fill="#05A2B3">100% LIVE ONLINE</text>
    </g>

    <!-- Main Title with Shimmering Gradient -->
    <text x="0" y="58" class="font-display" font-size="26" font-weight="800" fill="url(#flagship-title-grad)">
      Women’s Empowerment Marketplace
    </text>

    <!-- Subtitle / Architecture Highlights -->
    <text x="0" y="86" class="font-mono" font-size="12" fill="#38BDF8">
      Full-stack digital commerce engine empowering women artisans &amp; cottage craft entrepreneurs.
    </text>
    <text x="0" y="108" class="font-mono" font-size="11.5" fill="#8B949E">
      ShopClues &amp; Deals UI · Artisan Provenance Engine · JWT Auth · Dynamic Cart · Seller Telemetry
    </text>
    <text x="0" y="130" class="font-mono" font-size="11" fill="#3FB950">
      ⚡ Zero Listing Commissions · Fair-Wage Direct Remittance · 8 Artisan Craft Guilds
    </text>
  </g>

  <!-- Right Interactive Badges & Button -->
  <g transform="translate(970, 32)">
    <rect width="195" height="32" rx="7" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="97" y="20" text-anchor="middle" class="font-display" font-size="11" font-weight="700" fill="#05A2B3">✦ FULL-STACK REACT</text>

    <g transform="translate(0, 42)">
      <rect width="195" height="32" rx="7" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="97" y="20" text-anchor="middle" class="font-display" font-size="11" font-weight="700" fill="#10B981">✦ VERIFIED LIVE DEMO</text>
    </g>

    <g transform="translate(0, 84)">
      <rect width="195" height="36" rx="8" fill="#05A2B3"/>
      <text x="97" y="22" text-anchor="middle" class="font-display" font-size="12" font-weight="800" fill="#FFFFFF">VISIT LIVE STORE ➔</text>
    </g>
  </g>
</svg>
