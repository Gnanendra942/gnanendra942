<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="100%" height="100%">
  <defs>
    <!-- Dark Surface Gradient -->
    <linearGradient id="bg-flagship" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>

    <!-- Animated Border Glow Beam -->
    <linearGradient id="flagship-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58A6FF">
        <animate attributeName="stop-color" values="#58A6FF;#8957E5;#3FB950;#58A6FF" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#30363D" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8957E5">
        <animate attributeName="stop-color" values="#8957E5;#3FB950;#58A6FF;#8957E5" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Shimmering Title Gradient -->
    <linearGradient id="flagship-title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF">
        <animate attributeName="stop-color" values="#FFFFFF;#79C0FF;#FFFFFF" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#79C0FF">
        <animate attributeName="stop-color" values="#79C0FF;#FFFFFF;#58A6FF;#79C0FF" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#58A6FF">
        <animate attributeName="stop-color" values="#58A6FF;#8957E5;#FFFFFF;#58A6FF" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="f-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .font-display { font-family: 'Inter', 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'IBM Plex Mono', Menlo, monospace; }
      
      @keyframes floatIcon {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-4px) rotate(3deg); }
      }
      @keyframes radarPulse {
        0% { r: 3px; opacity: 0.9; }
        100% { r: 9px; opacity: 0; }
      }
      .anim-icon { animation: floatIcon 3.5s infinite ease-in-out; }
      .anim-beacon { animation: radarPulse 2s infinite ease-out; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="1200" height="180" rx="14" fill="url(#bg-flagship)" stroke="url(#flagship-beam)" stroke-width="1.6"/>
  <rect x="0" y="0" width="1200" height="3" rx="1.5" fill="#58A6FF"/>

  <!-- Left Icon Frame with Glowing Ambient -->
  <g transform="translate(36, 42)">
    <rect width="70" height="70" rx="14" fill="#161B22" stroke="#30363D" stroke-width="1.2" filter="url(#f-glow)"/>
    <g transform="translate(35, 45)">
      <g class="anim-icon">
        <text text-anchor="middle" font-size="32">🛍️</text>
      </g>
    </g>
  </g>

  <!-- Title & Description (Center) -->
  <g transform="translate(130, 36)">
    <!-- Status Tag Pill -->
    <g transform="translate(0, 0)">
      <rect width="210" height="22" rx="5" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <circle cx="12" cy="11" r="3.5" fill="#3FB950"/>
      <circle cx="12" cy="11" r="3.5" fill="none" stroke="#3FB950" stroke-width="1" class="anim-beacon"/>
      <text x="24" y="15" class="font-mono" font-size="10" font-weight="700" fill="#3FB950">● FLAGSHIP ARCHITECTURE</text>
      <text x="180" y="15" class="font-mono" font-size="9" font-weight="700" fill="#58A6FF">LIVE</text>
    </g>

    <!-- Main Title with Shimmering Gradient -->
    <text x="0" y="52" class="font-display" font-size="25" font-weight="800" fill="url(#flagship-title-grad)">
      Women’s Empowerment Marketplace
    </text>

    <!-- Subtitle / Architecture Highlights -->
    <text x="0" y="78" class="font-mono" font-size="12" fill="#58A6FF">
      Full-stack digital commerce engine empowering women artisans &amp; local cottage entrepreneurs.
    </text>
    <text x="0" y="98" class="font-mono" font-size="11.5" fill="#8B949E">
      Dynamic storefronts · Seller analytics suite · Encrypted JWT Auth · Distributed Order Pipeline
    </text>
  </g>

  <!-- Right Interactive Badges & Button -->
  <g transform="translate(970, 36)">
    <rect width="190" height="32" rx="7" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="95" y="20" text-anchor="middle" class="font-display" font-size="11" font-weight="700" fill="#58A6FF">✦ FULL-STACK REACT</text>

    <g transform="translate(0, 40)">
      <rect width="190" height="32" rx="7" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="95" y="20" text-anchor="middle" class="font-display" font-size="11" font-weight="700" fill="#3FB950">✦ SECURE COMMERCE</text>
    </g>

    <g transform="translate(0, 80)">
      <rect width="190" height="28" rx="7" fill="#2563EB"/>
      <text x="95" y="18" text-anchor="middle" class="font-display" font-size="11" font-weight="700" fill="#FFFFFF">EXPLORE REPO ➔</text>
    </g>
  </g>
</svg>
