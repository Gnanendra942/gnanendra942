<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 330" width="100%" height="100%">
  <defs>
    <!-- Terminal Dark Surface Gradient -->
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="40%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>

    <linearGradient id="term-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3FB950" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#3FB950;#58A6FF;#8957E5;#3FB950" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#30363D" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#58A6FF;#8957E5;#3FB950;#58A6FF" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="term-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'IBM Plex Mono', Menlo, monospace; }
      
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      
      /* Staggered Line Reveals */
      @keyframes lineReveal1 { 0%, 5% { opacity: 0; } 8%, 100% { opacity: 1; } }
      @keyframes lineReveal2 { 0%, 15% { opacity: 0; } 18%, 100% { opacity: 1; } }
      @keyframes lineReveal3 { 0%, 26% { opacity: 0; } 29%, 100% { opacity: 1; } }
      @keyframes lineReveal4 { 0%, 38% { opacity: 0; } 41%, 100% { opacity: 1; } }
      @keyframes lineReveal5 { 0%, 50% { opacity: 0; } 53%, 100% { opacity: 1; } }
      @keyframes lineReveal6 { 0%, 62% { opacity: 0; } 65%, 100% { opacity: 1; } }
      @keyframes lineReveal7 { 0%, 74% { opacity: 0; } 77%, 100% { opacity: 1; } }
      @keyframes lineReveal8 { 0%, 86% { opacity: 0; } 89%, 100% { opacity: 1; } }

      .anim-cursor { animation: blinkCursor 0.8s infinite; }
      .term-l1 { animation: lineReveal1 12s infinite; }
      .term-l2 { animation: lineReveal2 12s infinite; }
      .term-l3 { animation: lineReveal3 12s infinite; }
      .term-l4 { animation: lineReveal4 12s infinite; }
      .term-l5 { animation: lineReveal5 12s infinite; }
      .term-l6 { animation: lineReveal6 12s infinite; }
      .term-l7 { animation: lineReveal7 12s infinite; }
      .term-l8 { animation: lineReveal8 12s infinite; }
    </style>
  </defs>

  <!-- Terminal Window Surface -->
  <rect width="580" height="330" rx="12" fill="url(#term-bg)" stroke="url(#term-border)" stroke-width="1.4"/>

  <!-- Window Titlebar -->
  <g transform="translate(0, 0)">
    <rect width="580" height="32" rx="12" fill="#161B22"/>
    <rect y="24" width="580" height="8" fill="#161B22"/>
    <line x1="0" y1="32" x2="580" y2="32" stroke="#30363D" stroke-width="1"/>

    <!-- Traffic Light Buttons -->
    <circle cx="20" cy="16" r="5" fill="#FF5F56"/>
    <circle cx="36" cy="16" r="5" fill="#FFBD2E"/>
    <circle cx="52" cy="16" r="5" fill="#27C93F"/>

    <!-- Title Centered -->
    <text x="290" y="20" text-anchor="middle" class="font-mono" font-size="11" font-weight="600" fill="#8B949E">
      gnanendra@dev-station: ~ (zsh)
    </text>
  </g>

  <!-- Terminal Body Content -->
  <g transform="translate(20, 52)">
    <!-- Line 1: Command 1 -->
    <g class="term-l1">
      <text x="0" y="14" class="font-mono" font-size="11.5" font-weight="700" fill="#3FB950">gnanendra@station:~$</text>
      <text x="175" y="14" class="font-mono" font-size="11.5" font-weight="700" fill="#F0F6FC">whoami</text>
    </g>

    <!-- Line 2: Response 1 -->
    <g class="term-l2" transform="translate(0, 26)">
      <text x="0" y="14" class="font-mono" font-size="11.5" font-weight="700" fill="#58A6FF">
        ➜ Chowreddygari Gnanendra Reddy (3rd-Year B.Tech CSE)
      </text>
    </g>

    <!-- Line 3: Command 2 -->
    <g class="term-l3" transform="translate(0, 56)">
      <text x="0" y="14" class="font-mono" font-size="11.5" font-weight="700" fill="#3FB950">gnanendra@station:~$</text>
      <text x="175" y="14" class="font-mono" font-size="11.5" font-weight="700" fill="#F0F6FC">cat academic_manifest.json</text>
    </g>

    <!-- Line 4: JSON Output Part 1 -->
    <g class="term-l4" transform="translate(0, 82)">
      <text x="14" y="14" class="font-mono" font-size="10.5" fill="#C084FC">"institution":</text>
      <text x="135" y="14" class="font-mono" font-size="10.5" fill="#FFE699">"Vel Tech University, Chennai",</text>
    </g>

    <!-- Line 5: JSON Output Part 2 -->
    <g class="term-l5" transform="translate(0, 104)">
      <text x="14" y="14" class="font-mono" font-size="10.5" fill="#C084FC">"student_id":</text>
      <text x="125" y="14" class="font-mono" font-size="10.5" fill="#58A6FF">"VTU29661"</text>
      <text x="210" y="14" class="font-mono" font-size="10.5" fill="#8B949E">|</text>
      <text x="225" y="14" class="font-mono" font-size="10.5" fill="#C084FC">"reg_no":</text>
      <text x="295" y="14" class="font-mono" font-size="10.5" fill="#58A6FF">"24UECS0503"</text>
    </g>

    <!-- Line 6: JSON Output Part 3 -->
    <g class="term-l6" transform="translate(0, 126)">
      <text x="14" y="14" class="font-mono" font-size="10.5" fill="#C084FC">"core_stack":</text>
      <text x="125" y="14" class="font-mono" font-size="10.5" fill="#3FB950">["Java 21", "React 19", "IoT C++", "Next.js", "MySQL"]</text>
    </g>

    <!-- Line 7: Command 3 -->
    <g class="term-l7" transform="translate(0, 158)">
      <text x="0" y="14" class="font-mono" font-size="11.5" font-weight="700" fill="#3FB950">gnanendra@station:~$</text>
      <text x="175" y="14" class="font-mono" font-size="11.5" font-weight="700" fill="#F0F6FC">status --check-availability</text>
    </g>

    <!-- Line 8: Status Result with Glowing Cursor -->
    <g class="term-l8" transform="translate(0, 186)">
      <rect x="0" y="0" width="540" height="28" rx="4" fill="#0D1117" stroke="#3FB950" stroke-width="0.8"/>
      <circle cx="14" cy="14" r="3.5" fill="#3FB950"/>
      <text x="26" y="18" class="font-mono" font-size="10.5" font-weight="700" fill="#3FB950">
        ● STATUS: OPEN FOR INTERNSHIPS &amp; RESEARCH (2025–2028)
      </text>
    </g>

    <!-- Line 9: Active Command Prompt with Blinking Cursor -->
    <g transform="translate(0, 226)">
      <text x="0" y="14" class="font-mono" font-size="11.5" font-weight="700" fill="#3FB950">gnanendra@station:~$</text>
      <rect x="178" y="2" width="8" height="15" fill="#3FB950" class="anim-cursor" filter="url(#term-glow)"/>
    </g>
  </g>
</svg>
