<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="spot-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="40%" stop-color="#0B1320"/>
      <stop offset="100%" stop-color="#07120D"/>
    </linearGradient>

    <!-- Spotify Green Border Beam -->
    <linearGradient id="spot-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1DB954">
        <animate attributeName="stop-color" values="#1DB954;#10B981;#38BDF8;#1DB954" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#38BDF8;#1DB954;#10B981" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="spot-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .font-display { font-family: 'Inter', 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'IBM Plex Mono', Menlo, monospace; }

      @keyframes radarBeacon {
        0% { r: 3px; opacity: 1; }
        100% { r: 9px; opacity: 0; }
      }
      
      /* Equalizer Bar Dancing Animations */
      @keyframes eqDance1 { 0%, 100% { height: 6px; y: 44px; } 50% { height: 34px; y: 16px; } }
      @keyframes eqDance2 { 0%, 100% { height: 26px; y: 24px; } 50% { height: 10px; y: 40px; } }
      @keyframes eqDance3 { 0%, 100% { height: 14px; y: 36px; } 50% { height: 42px; y: 8px; } }
      @keyframes eqDance4 { 0%, 100% { height: 38px; y: 12px; } 50% { height: 18px; y: 32px; } }
      @keyframes eqDance5 { 0%, 100% { height: 10px; y: 40px; } 50% { height: 36px; y: 14px; } }
      @keyframes eqDance6 { 0%, 100% { height: 30px; y: 20px; } 50% { height: 8px; y: 42px; } }
      @keyframes eqDance7 { 0%, 100% { height: 18px; y: 32px; } 50% { height: 40px; y: 10px; } }
      @keyframes eqDance8 { 0%, 100% { height: 34px; y: 16px; } 50% { height: 12px; y: 38px; } }
      @keyframes eqDance9 { 0%, 100% { height: 8px; y: 42px; } 50% { height: 28px; y: 22px; } }
      @keyframes eqDance10 { 0%, 100% { height: 24px; y: 26px; } 50% { height: 14px; y: 36px; } }

      .anim-radar { animation: radarBeacon 1.8s infinite ease-out; }
      .eq-1 { animation: eqDance1 1.1s infinite ease-in-out; }
      .eq-2 { animation: eqDance2 0.9s infinite ease-in-out; }
      .eq-3 { animation: eqDance3 1.3s infinite ease-in-out; }
      .eq-4 { animation: eqDance4 1.0s infinite ease-in-out; }
      .eq-5 { animation: eqDance5 1.2s infinite ease-in-out; }
      .eq-6 { animation: eqDance6 0.85s infinite ease-in-out; }
      .eq-7 { animation: eqDance7 1.15s infinite ease-in-out; }
      .eq-8 { animation: eqDance8 0.95s infinite ease-in-out; }
      .eq-9 { animation: eqDance9 1.25s infinite ease-in-out; }
      .eq-10 { animation: eqDance10 1.05s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="1200" height="150" rx="14" fill="url(#spot-bg)" stroke="url(#spot-border)" stroke-width="1.5"/>
  <rect x="0" y="0" width="1200" height="2.5" rx="1" fill="#1DB954"/>

  <!-- Left: Spotify Icon Frame -->
  <g transform="translate(28, 28)">
    <rect width="94" height="94" rx="12" fill="#141C2E" stroke="#1DB954" stroke-width="1.2" filter="url(#spot-glow)"/>
    
    <!-- Spotify Wave Icon -->
    <g transform="translate(47, 47)">
      <circle r="30" fill="#1DB954"/>
      <!-- Spotify 3 Arcs -->
      <path d="M-16,3 C-8,-2 10,-2 16,3" stroke="#0B0F19" stroke-width="3.6" stroke-linecap="round" fill="none"/>
      <path d="M-14,-4 C-6,-9 8,-9 14,-4" stroke="#0B0F19" stroke-width="3.4" stroke-linecap="round" fill="none"/>
      <path d="M-12,-11 C-4,-16 6,-16 12,-11" stroke="#0B0F19" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- Center-Left: Track Meta Details -->
  <g transform="translate(144, 28)">
    <!-- Eyebrow Status Pill -->
    <g transform="translate(0, 0)">
      <rect width="210" height="22" rx="4" fill="#0B132B" stroke="#1E293B" stroke-width="0.8"/>
      <circle cx="11" cy="11" r="3.5" fill="#1DB954"/>
      <circle cx="11" cy="11" r="3.5" fill="none" stroke="#1DB954" stroke-width="1" class="anim-radar"/>
      <text x="22" y="15" class="font-mono" font-size="9.5" font-weight="700" fill="#1DB954">CURRENTLY CODING TO</text>
      <text x="160" y="15" class="font-mono" font-size="9" font-weight="600" fill="#94A3B8">SPOTIFY</text>
    </g>

    <!-- Track Title -->
    <text x="0" y="48" class="font-display" font-size="20" font-weight="800" fill="#F8FAFC">
      Starboy (feat. Daft Punk)
    </text>

    <!-- Artist & Session Info -->
    <text x="0" y="70" class="font-mono" font-size="12" font-weight="600" fill="#38BDF8">
      The Weeknd · Starboy Album · 128 BPM Deep Focus Session
    </text>

    <!-- Dynamic Audio Progress Bar -->
    <g transform="translate(0, 84)">
      <text x="0" y="10" class="font-mono" font-size="9.5" fill="#94A3B8">02:38</text>
      <!-- Track Bar -->
      <rect x="42" y="4" width="340" height="6" rx="3" fill="#1E293B"/>
      <rect x="42" y="4" width="228" height="6" rx="3" fill="#1DB954"/>
      <circle cx="270" cy="7" r="5" fill="#FFFFFF" filter="url(#spot-glow)"/>
      <text x="394" y="10" class="font-mono" font-size="9.5" fill="#94A3B8">03:50</text>
    </g>
  </g>

  <!-- Center-Right: Animated Dancing Equalizer Frequency Bars -->
  <g transform="translate(730, 46)">
    <!-- 10 Animated Equalizer Bars -->
    <rect x="0" width="5" rx="2.5" fill="#1DB954" class="eq-1"/>
    <rect x="10" width="5" rx="2.5" fill="#10B981" class="eq-2"/>
    <rect x="20" width="5" rx="2.5" fill="#38BDF8" class="eq-3"/>
    <rect x="30" width="5" rx="2.5" fill="#1DB954" class="eq-4"/>
    <rect x="40" width="5" rx="2.5" fill="#818CF8" class="eq-5"/>
    <rect x="50" width="5" rx="2.5" fill="#1DB954" class="eq-6"/>
    <rect x="60" width="5" rx="2.5" fill="#10B981" class="eq-7"/>
    <rect x="70" width="5" rx="2.5" fill="#38BDF8" class="eq-8"/>
    <rect x="80" width="5" rx="2.5" fill="#1DB954" class="eq-9"/>
    <rect x="90" width="5" rx="2.5" fill="#10B981" class="eq-10"/>

    <text x="48" y="68" text-anchor="middle" class="font-mono" font-size="9" font-weight="700" fill="#1DB954">
      LIVE FREQUENCY
    </text>
  </g>

  <!-- Far Right: System State & Device Pill -->
  <g transform="translate(890, 44)">
    <rect width="275" height="62" rx="8" fill="#141C2E" stroke="#1E293B" stroke-width="1"/>
    <text x="18" y="24" class="font-display" font-size="11" font-weight="700" fill="#F8FAFC">MacBook Pro M-Series</text>
    <text x="18" y="44" class="font-mono" font-size="9.5" fill="#94A3B8">320 kbps High Fidelity Stream · Noise-Cancelling Active</text>
    <circle cx="255" cy="20" r="4" fill="#10B981"/>
  </g>
</svg>
