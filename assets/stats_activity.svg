<svg width="495" height="220" viewBox="0 0 495 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#8957E5"/>
    </linearGradient>
    <linearGradient id="actBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF">
        <animate attributeName="stop-color" values="#58A6FF;#8957E5;#58A6FF" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8957E5"/>
    </linearGradient>
    <linearGradient id="rainbowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#818CF8;#EC4899;#F59E0B;#10B981;#38BDF8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#818CF8">
        <animate attributeName="stop-color" values="#818CF8;#EC4899;#F59E0B;#10B981;#38BDF8;#818CF8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#38BDF8;#818CF8;#EC4899;#F59E0B;#10B981" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <style>
      @keyframes pulseSync {
        0% { r: 3px; opacity: 1; }
        100% { r: 8px; opacity: 0; }
      }
      .anim-sync { animation: pulseSync 2s infinite ease-out; }
    </style>
  </defs>

  <!-- Container Box with Continuous Rainbow Hue-Shifting Loop -->
