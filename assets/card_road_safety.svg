<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-rs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <style>
      .font-display { font-family: 'Inter', 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'IBM Plex Mono', Menlo, monospace; }
      .card-title { font-weight: 700; font-size: 18px; fill: #F8FAFC; }
      .card-desc { font-size: 11px; fill: #94A3B8; }
      .card-chip { font-size: 10px; font-weight: 600; }
    </style>
  </defs>

  <rect width="580" height="220" rx="12" fill="url(#bg-rs)" stroke="#1E293B" stroke-width="1.2"/>
  <rect x="0" y="0" width="580" height="2" rx="1" fill="#38BDF8"/>
  
  <!-- Status Badge -->
  <g transform="translate(415, 20)">
    <rect x="0" y="0" width="140" height="22" rx="4" fill="#141C2E" stroke="#1E293B" stroke-width="1"/>
    <circle cx="10" cy="11" r="3" fill="#10B981"/>
    <text x="20" y="15" class="font-mono card-chip" fill="#10B981">SMART IOT SYSTEM</text>
  </g>

  <!-- Title & Description -->
  <text x="24" y="42" class="font-display card-title">Intelligent Curved Road Safety</text>
  <text x="24" y="78" class="font-mono card-desc">
    <tspan x="24" dy="0">• Smart infrastructure hardware for blind mountain curves &amp; sharp bends.</tspan>
    <tspan x="24" dy="18">• Automatic hazard warning signals, speed telemetry &amp; collision prevention.</tspan>
    <tspan x="24" dy="18">• Arduino C++ · Distance &amp; Motion Sensors · Real-Time LED Warning Hub</tspan>
  </text>

  <!-- Tech Tags -->
  <g transform="translate(24, 156)">
    <rect x="0" y="0" width="80" height="24" rx="4" fill="#141C2E" stroke="#1E293B" stroke-width="1"/>
    <text x="40" y="16" text-anchor="middle" class="font-mono card-chip" fill="#38BDF8">ARDUINO</text>

    <rect x="88" y="0" width="90" height="24" rx="4" fill="#141C2E" stroke="#1E293B" stroke-width="1"/>
    <text x="133" y="16" text-anchor="middle" class="font-mono card-chip" fill="#60A5FA">IOT SENSORS</text>

    <rect x="186" y="0" width="95" height="24" rx="4" fill="#141C2E" stroke="#1E293B" stroke-width="1"/>
    <text x="233" y="16" text-anchor="middle" class="font-mono card-chip" fill="#10B981">SAFETY TECH</text>
  </g>

  <!-- View Repo Link -->
  <g transform="translate(425, 156)">
    <rect x="0" y="0" width="130" height="24" rx="4" fill="#38BDF8"/>
    <text x="65" y="16" text-anchor="middle" class="font-display" font-size="10.5" font-weight="700" fill="#0B0F19">VIEW PROJECT ➔</text>
  </g>
</svg>
