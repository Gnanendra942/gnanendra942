<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 64" width="100%" height="64">
  <defs>
    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Animated Signature Gradient -->
    <linearGradient id="sig-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#818CF8;#38BDF8" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#818CF8">
        <animate attributeName="stop-color" values="#818CF8;#10B981;#818CF8" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#38BDF8;#10B981" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <style>
      .font-display { font-family: 'Inter', 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'IBM Plex Mono', Menlo, monospace; }

      @keyframes pulseHeart {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.3); }
      }
      @keyframes pulseBeacon {
        0% { r: 3px; opacity: 1; }
        100% { r: 8px; opacity: 0; }
      }
      .heart-beat { animation: pulseHeart 1.5s infinite ease-in-out; transform-box: fill-box; transform-origin: center; display: inline-block; }
      .beacon-ring { animation: pulseBeacon 2s infinite ease-out; }
    </style>
  </defs>

  <rect width="1200" height="64" rx="10" fill="url(#footer-bg)" stroke="#1E293B" stroke-width="1.2"/>
  <rect x="0" y="0" width="1200" height="2" rx="1" fill="#38BDF8" opacity="0.6"/>

  <!-- Left: Signature with Beating Heart -->
  <g transform="translate(28, 38)">
    <text class="font-mono" font-size="11.5" fill="#94A3B8">
      Crafted with <tspan fill="#EF4444" class="heart-beat">♥</tspan> &amp; Precision by 
      <tspan fill="url(#sig-grad)" font-weight="700">Chowreddygari Gnanendra Reddy</tspan>
      <tspan fill="#64748B"> · Vel Tech CSE '28</tspan>
    </text>
  </g>

  <!-- Right: Verification Node & 60 FPS Status -->
  <g transform="translate(940, 20)">
    <rect width="232" height="26" rx="5" fill="#141C2E" stroke="#1E293B" stroke-width="1"/>
    <circle cx="14" cy="13" r="3.5" fill="#10B981"/>
    <circle cx="14" cy="13" r="3.5" fill="none" stroke="#10B981" stroke-width="1" class="beacon-ring"/>
    <text x="26" y="17" class="font-mono" font-size="9.5" font-weight="700" fill="#10B981">ALL SYSTEMS OPERATIONAL</text>
    <text x="190" y="17" class="font-mono" font-size="9" font-weight="600" fill="#38BDF8">· 60 FPS</text>
  </g>
</svg>
