<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 64" width="100%" height="64">
  <defs>
    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0B1224"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <!-- Animated Signature Gradient -->
    <linearGradient id="sig-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF">
        <animate attributeName="stop-color" values="#00F0FF;#8B5CF6;#10B981;#00F0FF" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#10B981;#00F0FF;#8B5CF6" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#00F0FF;#8B5CF6;#10B981" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <style>
      .font-display { font-family: 'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'IBM Plex Mono', Menlo, Consolas, monospace; }

      @keyframes pulseHeart {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.3); }
      }
      @keyframes pulseBeacon {
        0% { r: 3px; opacity: 1; }
        100% { r: 9px; opacity: 0; }
      }
      .heart-beat { animation: pulseHeart 1.5s infinite ease-in-out; transform-box: fill-box; transform-origin: center; display: inline-block; }
      .beacon-ring { animation: pulseBeacon 2s infinite ease-out; }
    </style>
  </defs>

  <rect width="1200" height="64" rx="10" fill="url(#footer-bg)" stroke="#1E293B" stroke-width="1.3"/>
  <rect x="0" y="0" width="1200" height="2" rx="1" fill="#00F0FF" opacity="0.7"/>

  <!-- Left: Signature with Beating Heart -->
  <g transform="translate(28, 38)">
    <text class="font-mono" font-size="11.5" fill="#94A3B8">
      Crafted with <tspan fill="#F43F5E" class="heart-beat">♥</tspan> &amp; Precision by 
      <tspan fill="url(#sig-grad)" font-weight="700">Chowreddygari Gnanendra Reddy</tspan>
      <tspan fill="#64748B"> · Vel Tech CSE '28</tspan>
    </text>
  </g>

  <!-- Right: Verification Node & 60 FPS Status -->
  <g transform="translate(920, 19)">
    <rect width="252" height="26" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <circle cx="14" cy="13" r="3.5" fill="#10B981"/>
    <circle cx="14" cy="13" r="3.5" fill="none" stroke="#10B981" stroke-width="1.2" class="beacon-ring"/>
    <text x="26" y="17" class="font-mono" font-size="9.5" font-weight="700" fill="#10B981">ALL SYSTEMS OPERATIONAL</text>
    <text x="205" y="17" class="font-mono" font-size="9" font-weight="600" fill="#00F0FF">· 60 FPS</text>
  </g>
</svg>
