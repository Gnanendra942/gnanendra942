<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="ag-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="ag-area-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#818CF8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="ag-stroke-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="ag-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="240" rx="12" fill="url(#ag-bg)" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Top Title & Metrics -->
  <g transform="translate(24, 24)">
    <circle cx="5" cy="5" r="4" fill="#38BDF8"/>
    <text x="16" y="9" font-family="'Inter', 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" letter-spacing="0.5">CONTRIBUTION VELOCITY &amp; ACTIVITY GRAPH</text>
    <text x="1152" y="9" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', 'IBM Plex Mono', Menlo, monospace" font-size="10" font-weight="600" fill="#38BDF8">ANNUAL OUTPUT TRAJECTORY</text>
  </g>

  <!-- Grid Horizontal Lines -->
  <g transform="translate(60, 60)" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="4 4">
    <line x1="0" y1="0" x2="1080" y2="0"/>
    <line x1="0" y1="35" x2="1080" y2="35"/>
    <line x1="0" y1="70" x2="1080" y2="70"/>
    <line x1="0" y1="105" x2="1080" y2="105"/>
    <line x1="0" y1="140" x2="1080" y2="140"/>
  </g>

  <!-- Graph Curve & Area -->
  <g transform="translate(60, 60)">
    <!-- Filled Gradient Area Under Curve -->
    <path d="M 0 135 
             C 80 130, 140 90, 200 85 
             C 260 80, 320 115, 380 95 
             C 440 75, 500 40, 560 30 
             C 620 20, 680 70, 740 50 
             C 800 30, 860 15, 920 25 
             C 980 35, 1040 10, 1080 15 
             L 1080 140 L 0 140 Z" fill="url(#ag-area-grad)"/>

    <!-- Glowing Stroke Path -->
    <path d="M 0 135 
             C 80 130, 140 90, 200 85 
             C 260 80, 320 115, 380 95 
             C 440 75, 500 40, 560 30 
             C 620 20, 680 70, 740 50 
             C 800 30, 860 15, 920 25 
             C 980 35, 1040 10, 1080 15" fill="none" stroke="url(#ag-stroke-grad)" stroke-width="3" stroke-linecap="round" filter="url(#ag-glow)"/>

    <!-- High Points Marker Dots -->
    <circle cx="200" cy="85" r="4" fill="#38BDF8" stroke="#0B0F19" stroke-width="2"/>
    <circle cx="560" cy="30" r="5" fill="#818CF8" stroke="#0B0F19" stroke-width="2"/>
    <circle cx="920" cy="25" r="4" fill="#10B981" stroke="#0B0F19" stroke-width="2"/>
    <circle cx="1080" cy="15" r="5" fill="#10B981" stroke="#0B0F19" stroke-width="2"/>
  </g>

  <!-- Month Markers -->
  <g transform="translate(60, 218)" font-family="'JetBrains Mono', 'Fira Code', 'IBM Plex Mono', Menlo, monospace" font-size="10" font-weight="500" fill="#94A3B8">
    <text x="0" y="0">Jan</text>
    <text x="100" y="0">Feb</text>
    <text x="200" y="0">Mar</text>
    <text x="300" y="0">Apr</text>
    <text x="400" y="0">May</text>
    <text x="500" y="0">Jun</text>
    <text x="600" y="0">Jul</text>
    <text x="700" y="0">Aug</text>
    <text x="800" y="0">Sep</text>
    <text x="900" y="0">Oct</text>
    <text x="1000" y="0">Nov</text>
    <text x="1070" y="0">Dec</text>
  </g>
</svg>