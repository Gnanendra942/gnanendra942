<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 16" width="100%" height="16">
  <defs>
    <!-- Oscillating Laser Gradient -->
    <linearGradient id="cyber-line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1117" stop-opacity="0"/>
      <stop offset="20%" stop-color="#58A6FF" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#58A6FF;#8957E5;#3FB950;#58A6FF" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#8957E5" stop-opacity="1">
        <animate attributeName="stop-color" values="#8957E5;#3FB950;#58A6FF;#8957E5" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="80%" stop-color="#3FB950" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#3FB950;#58A6FF;#8957E5;#3FB950" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="div-glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.6); opacity: 1; }
      }
      @keyframes rotateDiamond {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .node-pulse { animation: pulseNode 2s infinite ease-in-out; transform-box: fill-box; transform-origin: center; }
      .diamond-spin { animation: rotateDiamond 8s infinite linear; transform-box: fill-box; transform-origin: center; }
    </style>
  </defs>

  <!-- Background Base Track -->
  <line x1="40" y1="8" x2="1160" y2="8" stroke="#30363D" stroke-width="1" opacity="0.6"/>

  <!-- Active Neon Laser Line -->
  <line x1="80" y1="8" x2="1120" y2="8" stroke="url(#cyber-line-grad)" stroke-width="2.2" stroke-linecap="round" filter="url(#div-glow)"/>

  <!-- Moving Laser Energy Photons -->
  <circle cy="8" r="3" fill="#79C0FF" filter="url(#div-glow)">
    <animate attributeName="cx" values="100;1100;100" dur="5s" repeatCount="indefinite" ease="ease-in-out"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="5s" repeatCount="indefinite"/>
  </circle>

  <circle cy="8" r="2.5" fill="#3FB950" filter="url(#div-glow)">
    <animate attributeName="cx" values="1100;100;1100" dur="4s" repeatCount="indefinite" ease="ease-in-out"/>
    <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Left Accent Nodes -->
  <circle cx="300" cy="8" r="2.5" fill="#58A6FF" class="node-pulse"/>
  <circle cx="450" cy="8" r="2" fill="#8957E5" class="node-pulse"/>

  <!-- Center Diamond Embellishment -->
  <g transform="translate(600, 8)">
    <rect x="-6" y="-6" width="12" height="12" rx="2" fill="#161B22" stroke="#58A6FF" stroke-width="1.2" class="diamond-spin"/>
    <circle cx="0" cy="0" r="3" fill="#38BDF8" filter="url(#div-glow)"/>
    <circle cx="0" cy="0" r="6" fill="none" stroke="#818CF8" stroke-width="0.8" opacity="0.6">
      <animate attributeName="r" values="4;9;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Right Accent Nodes -->
  <circle cx="750" cy="8" r="2" fill="#818CF8" class="node-pulse"/>
  <circle cx="900" cy="8" r="2.5" fill="#10B981" class="node-pulse"/>
</svg>
