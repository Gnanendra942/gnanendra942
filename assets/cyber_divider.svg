<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 16" width="100%" height="16">
  <defs>
    <!-- Oscillating Neon Aurora Laser Gradient -->
    <linearGradient id="cyber-line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#060913" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00F0FF" stop-opacity="0.9">
        <animate attributeName="stop-color" values="#00F0FF;#8B5CF6;#10B981;#00F0FF" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="1">
        <animate attributeName="stop-color" values="#8B5CF6;#10B981;#00F0FF;#8B5CF6" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="80%" stop-color="#10B981" stop-opacity="0.9">
        <animate attributeName="stop-color" values="#10B981;#00F0FF;#8B5CF6;#10B981" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#060913" stop-opacity="0"/>
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="div-glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.6); opacity: 1; }
      }
      @keyframes rotateDiamond {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .node-pulse { animation: pulseNode 2s infinite ease-in-out; transform-box: fill-box; transform-origin: center; }
      .diamond-spin { animation: rotateDiamond 8s infinite linear; transform-box: fill-box; transform-origin: center; }
    </style>
  </defs>

  <!-- Background Base Track -->
  <line x1="40" y1="8" x2="1160" y2="8" stroke="#1E293B" stroke-width="1" opacity="0.6"/>

  <!-- Active Neon Laser Line -->
  <line x1="80" y1="8" x2="1120" y2="8" stroke="url(#cyber-line-grad)" stroke-width="2.4" stroke-linecap="round" filter="url(#div-glow)"/>

  <!-- Moving Laser Energy Photons -->
  <circle cy="8" r="3.2" fill="#7AF2FF" filter="url(#div-glow)">
    <animate attributeName="cx" values="100;1100;100" dur="5s" repeatCount="indefinite" ease="ease-in-out"/>
    <animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/>
  </circle>

  <circle cy="8" r="2.8" fill="#10B981" filter="url(#div-glow)">
    <animate attributeName="cx" values="1100;100;1100" dur="4s" repeatCount="indefinite" ease="ease-in-out"/>
    <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Accent Nodes -->
  <circle cx="300" cy="8" r="2.5" fill="#00F0FF" class="node-pulse"/>
  <circle cx="450" cy="8" r="2" fill="#8B5CF6" class="node-pulse"/>
  <circle cx="750" cy="8" r="2" fill="#8B5CF6" class="node-pulse"/>
  <circle cx="900" cy="8" r="2.5" fill="#10B981" class="node-pulse"/>

  <!-- Center Focal Diamond -->
  <g transform="translate(600, 8)">
    <circle cx="0" cy="0" r="7" fill="#060913" stroke="#8B5CF6" stroke-width="1.2"/>
    <rect x="-3" y="-3" width="6" height="6" fill="#00F0FF" class="diamond-spin"/>
  </g>
</svg>
