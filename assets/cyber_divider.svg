<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 8" width="100%" height="8">
  <defs>
    <linearGradient id="cyber-line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B0F19" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="1"/>
      <stop offset="75%" stop-color="#10B981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </linearGradient>
    <filter id="div-glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <line x1="20" y1="4" x2="1180" y2="4" stroke="url(#cyber-line-grad)" stroke-width="1.8" stroke-linecap="round" filter="url(#div-glow)"/>
  <circle cx="600" cy="4" r="3" fill="#818CF8" filter="url(#div-glow)"/>
  <circle cx="450" cy="4" r="2" fill="#38BDF8"/>
  <circle cx="750" cy="4" r="2" fill="#10B981"/>
</svg>
