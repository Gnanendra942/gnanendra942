<svg width="1000" height="220" viewBox="0 0 1000 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1000" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7AF2FF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#7AF2FF"/>
      <stop offset="70%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="220" rx="20" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="998" height="218" rx="19" stroke="#7AF2FF" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Glowing background orbs -->
  <circle cx="150" cy="60" r="70" fill="#7AF2FF" fill-opacity="0.08" filter="url(#glow)"/>
  <circle cx="850" cy="140" r="90" fill="#8B5CF6" fill-opacity="0.08" filter="url(#glow)"/>

  <!-- Wave decorations -->
  <path d="M0 160 C 250 120, 450 200, 700 150 C 850 120, 950 170, 1000 155 L 1000 220 L 0 220 Z" fill="url(#wave1)"/>
  <path d="M0 180 C 200 150, 400 210, 650 170 C 800 145, 900 190, 1000 175 L 1000 220 L 0 220 Z" fill="url(#wave2)"/>

  <!-- Title & Subtitle -->
  <text x="500" y="90" text-anchor="middle" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="1">Hi there, I'm Gnanendra 👋</text>
  <text x="500" y="130" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" letter-spacing="2.5">COMPUTER SCIENCE UNDERGRAD  •  JAVA &amp; WEB DEVELOPER  •  TECH ENTHUSIAST</text>
</svg>
