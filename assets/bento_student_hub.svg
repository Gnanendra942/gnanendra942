<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hub-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0B1224"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <!-- Animated High-Voltage Card Top Beams -->
    <linearGradient id="beam-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF">
        <animate attributeName="stop-color" values="#00F0FF;#8B5CF6;#00F0FF" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="beam-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B">
        <animate attributeName="stop-color" values="#F59E0B;#F97316;#F59E0B" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <linearGradient id="beam-violet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7">
        <animate attributeName="stop-color" values="#A855F7;#38BDF8;#A855F7" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>

    <linearGradient id="beam-mint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#00F0FF;#10B981" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <filter id="hub-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .font-display { font-family: 'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'IBM Plex Mono', Menlo, Consolas, monospace; }
      .hub-title { font-weight: 700; font-size: 15px; fill: #F8FAFC; }
      .hub-sub { font-size: 11px; fill: #94A3B8; }
      .hub-tag { font-size: 10px; font-weight: 700; }
      
      @keyframes radarPulse {
        0% { r: 3px; opacity: 0.9; }
        100% { r: 11px; opacity: 0; }
      }
      @keyframes floatCard {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      .anim-radar { animation: radarPulse 2s infinite cubic-bezier(0, 0.2, 0.8, 1); }
      .card-float-1 { animation: floatCard 4s infinite ease-in-out; }
      .card-float-2 { animation: floatCard 4.5s infinite ease-in-out 0.5s; }
      .card-float-3 { animation: floatCard 4.2s infinite ease-in-out 1s; }
      .card-float-4 { animation: floatCard 4.7s infinite ease-in-out 1.5s; }
    </style>
  </defs>

  <rect width="1200" height="230" rx="14" fill="url(#hub-bg)" stroke="#1E293B" stroke-width="1.3"/>

  <!-- ================= Quadrant 1: Vel Tech University Academic Orbit ================= -->
  <g transform="translate(24, 20)">
    <g class="card-float-1">
      <rect width="270" height="190" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
      <rect x="0" y="0" width="270" height="3" rx="1.5" fill="url(#beam-cyan)"/>
      
      <!-- Header with Pulsing Beacon -->
      <g transform="translate(18, 22)">
        <circle cx="5" cy="5" r="4" fill="#00F0FF"/>
        <circle cx="5" cy="5" r="4" fill="none" stroke="#00F0FF" stroke-width="1.2" class="anim-radar"/>
        <text x="18" y="9" class="font-display hub-title">Vel Tech University</text>
      </g>
      <text x="18" y="52" class="font-mono hub-sub">B.Tech in CSE · Chennai, TN</text>
      
      <line x1="18" y1="68" x2="252" y2="68" stroke="#1E293B" stroke-width="1"/>
      
      <text x="18" y="92" class="font-mono hub-sub">Student ID: <tspan fill="#00F0FF" font-weight="700">VTU29661</tspan></text>
      <text x="18" y="112" class="font-mono hub-sub">Register No: <tspan fill="#F8FAFC" font-weight="600">24UECS0503</tspan></text>
      <text x="18" y="132" class="font-mono hub-sub">Level: <tspan fill="#10B981" font-weight="700">3rd Year CSE</tspan> <tspan fill="#94A3B8">(CGPA: 8.6)</tspan></text>
      
      <!-- Tag Pill -->
      <g transform="translate(18, 148)">
        <rect width="140" height="24" rx="5" fill="#060913" stroke="#0284C7" stroke-width="1"/>
        <text x="70" y="16" text-anchor="middle" class="font-mono hub-tag" fill="#00F0FF">CSE 2024–2028</text>
      </g>
    </g>
  </g>

  <!-- ================= Quadrant 2: Java & OOP Architecture Core ================= -->
  <g transform="translate(314, 20)">
    <g class="card-float-2">
      <rect width="270" height="190" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
      <rect x="0" y="0" width="270" height="3" rx="1.5" fill="url(#beam-gold)"/>
      
      <!-- Header with Pulsing Beacon -->
      <g transform="translate(18, 22)">
        <circle cx="5" cy="5" r="4" fill="#F59E0B"/>
        <circle cx="5" cy="5" r="4" fill="none" stroke="#F59E0B" stroke-width="1.2" class="anim-radar"/>
        <text x="18" y="9" class="font-display hub-title">Java &amp; OOP Core</text>
      </g>
      <text x="18" y="52" class="font-mono hub-sub">Applied Algorithms &amp; Testing</text>
      
      <line x1="18" y1="68" x2="252" y2="68" stroke="#1E293B" stroke-width="1"/>
      
      <text x="18" y="92" class="font-mono hub-sub">Paradigm: <tspan fill="#F59E0B" font-weight="700">OOP &amp; Modularity</tspan></text>
      <text x="18" y="112" class="font-mono hub-sub">Mastery: <tspan fill="#F8FAFC" font-weight="600">DSA &amp; Test Suites</tspan></text>
      <text x="18" y="132" class="font-mono hub-sub">Precision: <tspan fill="#10B981" font-weight="600">● Algorithmic Logic</tspan></text>
      
      <!-- Tag Pill -->
      <g transform="translate(18, 148)">
        <rect width="150" height="24" rx="5" fill="#060913" stroke="#D97706" stroke-width="1"/>
        <text x="75" y="16" text-anchor="middle" class="font-mono hub-tag" fill="#F59E0B">JAVA 21 SPECIALIST</text>
      </g>
    </g>
  </g>

  <!-- ================= Quadrant 3: Web & Full-Stack Development ================= -->
  <g transform="translate(604, 20)">
    <g class="card-float-3">
      <rect width="270" height="190" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
      <rect x="0" y="0" width="270" height="3" rx="1.5" fill="url(#beam-violet)"/>
      
      <!-- Header with Pulsing Beacon -->
      <g transform="translate(18, 22)">
        <circle cx="5" cy="5" r="4" fill="#A855F7"/>
        <circle cx="5" cy="5" r="4" fill="none" stroke="#A855F7" stroke-width="1.2" class="anim-radar"/>
        <text x="18" y="9" class="font-display hub-title">Full-Stack Web</text>
      </g>
      <text x="18" y="52" class="font-mono hub-sub">Modern Reactive Architecture</text>
      
      <line x1="18" y1="68" x2="252" y2="68" stroke="#1E293B" stroke-width="1"/>
      
      <text x="18" y="92" class="font-mono hub-sub">Frontend: <tspan fill="#A855F7" font-weight="700">React 19 &amp; Next.js</tspan></text>
      <text x="18" y="112" class="font-mono hub-sub">Backend: <tspan fill="#00F0FF" font-weight="600">Node.js, Express, JWT</tspan></text>
      <text x="18" y="132" class="font-mono hub-sub">Styling: <tspan fill="#10B981" font-weight="600">● Tailwind &amp; Glassmorphism</tspan></text>
      
      <!-- Tag Pill -->
      <g transform="translate(18, 148)">
        <rect width="145" height="24" rx="5" fill="#060913" stroke="#7C3AED" stroke-width="1"/>
        <text x="72" y="16" text-anchor="middle" class="font-mono hub-tag" fill="#A855F7">WEB ARCHITECT</text>
      </g>
    </g>
  </g>

  <!-- ================= Quadrant 4: Smart IoT & Embedded Systems ================= -->
  <g transform="translate(894, 20)">
    <g class="card-float-4">
      <rect width="282" height="190" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
      <rect x="0" y="0" width="282" height="3" rx="1.5" fill="url(#beam-mint)"/>
      
      <!-- Header with Pulsing Beacon -->
      <g transform="translate(18, 22)">
        <circle cx="5" cy="5" r="4" fill="#10B981"/>
        <circle cx="5" cy="5" r="4" fill="none" stroke="#10B981" stroke-width="1.2" class="anim-radar"/>
        <text x="18" y="9" class="font-display hub-title">Smart Embedded IoT</text>
      </g>
      <text x="18" y="52" class="font-mono hub-sub">Telemetry &amp; Sensor Pipelines</text>
      
      <line x1="18" y1="68" x2="264" y2="68" stroke="#1E293B" stroke-width="1"/>
      
      <text x="18" y="92" class="font-mono hub-sub">Hardware: <tspan fill="#10B981" font-weight="700">Arduino Uno / C++</tspan></text>
      <text x="18" y="112" class="font-mono hub-sub">Telemetry: <tspan fill="#00F0FF" font-weight="600">Pulse Sensors &amp; Sonar</tspan></text>
      <text x="18" y="132" class="font-mono hub-sub">Systems: <tspan fill="#F59E0B" font-weight="600">● Hazard Avoidance &amp; ECG</tspan></text>
      
      <!-- Tag Pill -->
      <g transform="translate(18, 148)">
        <rect width="150" height="24" rx="5" fill="#060913" stroke="#059669" stroke-width="1"/>
        <text x="75" y="16" text-anchor="middle" class="font-mono hub-tag" fill="#10B981">HARDWARE ENGINEER</text>
      </g>
    </g>
  </g>
</svg>
