<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-iiot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0B1224"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <linearGradient id="beam-iiot" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF">
        <animate attributeName="stop-color" values="#00F0FF;#10B981;#8B5CF6;#00F0FF" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Mesh Glow Filter -->
    <filter id="iiot-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .font-display { font-family: 'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'IBM Plex Mono', Menlo, Consolas, monospace; }
      .card-title { font-weight: 700; font-size: 17px; fill: #F8FAFC; }
      .card-desc { font-size: 11px; fill: #94A3B8; }
      .card-chip { font-size: 10px; font-weight: 700; }

      @keyframes radarPulse {
        0% { r: 3px; opacity: 0.9; }
        100% { r: 12px; opacity: 0; }
      }
      @keyframes meshPulse {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -20; }
      }
      .anim-radar { animation: radarPulse 2s infinite cubic-bezier(0, 0.2, 0.8, 1); }
      .anim-mesh-hub { animation: meshPulse 2.5s infinite ease-in-out; transform-box: fill-box; transform-origin: center; }
      .anim-dash { stroke-dasharray: 4 3; animation: dashFlow 1.5s linear infinite; }
    </style>
  </defs>

  <rect width="580" height="220" rx="12" fill="url(#bg-iiot)" stroke="#1E293B" stroke-width="1.3"/>
  <rect x="0" y="0" width="580" height="3" rx="1.5" fill="url(#beam-iiot)"/>

  <!-- Status Badge -->
  <g transform="translate(370, 18)">
    <rect width="185" height="24" rx="5" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#00F0FF"/>
    <circle cx="12" cy="12" r="3.5" fill="none" stroke="#00F0FF" stroke-width="1" class="anim-radar"/>
    <text x="22" y="16" class="font-mono card-chip" fill="#00F0FF">INDUSTRY 4.0 · IIOT</text>
  </g>

  <!-- Animated Sensor Mesh Graphic (Right Ambient) -->
  <g transform="translate(485, 105)" opacity="0.6">
    <line x1="-30" y1="20" x2="0" y2="0" stroke="#00F0FF" stroke-width="1.2" class="anim-dash"/>
    <line x1="30" y1="20" x2="0" y2="0" stroke="#10B981" stroke-width="1.2" class="anim-dash"/>
    <line x1="0" y1="-30" x2="0" y2="0" stroke="#8B5CF6" stroke-width="1.2" class="anim-dash"/>
    
    <circle cx="-30" cy="20" r="4" fill="#00F0FF"/>
    <circle cx="30" cy="20" r="4" fill="#10B981"/>
    <circle cx="0" cy="-30" r="4" fill="#8B5CF6"/>
    
    <g class="anim-mesh-hub">
      <circle cx="0" cy="0" r="6" fill="#00F0FF" filter="url(#iiot-glow)"/>
    </g>
  </g>

  <!-- Title & Description -->
  <text x="24" y="38" class="font-display card-title">Industrial IoT &amp; Cyber-Physical Systems</text>
  <text x="24" y="72" class="font-mono card-desc">
    <tspan x="24" dy="0">• Smart industrial automation telemetry &amp; sensor acquisition mesh.</tspan>
    <tspan x="24" dy="18">• Edge-to-cloud protocols, cyber-physical integration &amp; machine diagnostics.</tspan>
    <tspan x="24" dy="18">• IIoT 4.0 · Sensor Networks · Industrial Automation · NPTEL Certified</tspan>
  </text>

  <!-- Telemetry Sensor Status Line -->
  <g transform="translate(24, 134)">
    <rect width="320" height="22" rx="4" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <circle cx="12" cy="11" r="3" fill="#10B981"/>
    <text x="22" y="15" class="font-mono" font-size="9.5" fill="#10B981">NPTEL CLASSIFICATION: <tspan fill="#F59E0B">ELITE (IIT KHARAGPUR)</tspan></text>
  </g>

  <!-- Tech Tags -->
  <g transform="translate(24, 172)">
    <rect width="78" height="26" rx="5" fill="#0F172A" stroke="#0284C7" stroke-width="1"/>
    <text x="39" y="17" text-anchor="middle" class="font-mono card-chip" fill="#00F0FF">IIOT 4.0</text>

    <rect x="86" width="75" height="26" rx="5" fill="#0F172A" stroke="#7C3AED" stroke-width="1"/>
    <text x="123" y="17" text-anchor="middle" class="font-mono card-chip" fill="#8B5CF6">SENSORS</text>

    <rect x="169" width="105" height="26" rx="5" fill="#0F172A" stroke="#059669" stroke-width="1"/>
    <text x="221" y="17" text-anchor="middle" class="font-mono card-chip" fill="#10B981">NPTEL ELITE</text>
  </g>

  <!-- View Repo Link -->
  <g transform="translate(425, 172)">
    <rect width="130" height="26" rx="5" fill="#0284C7"/>
    <text x="65" y="17" text-anchor="middle" class="font-display" font-size="11" font-weight="700" fill="#FFFFFF">VIEW PROJECT ➔</text>
  </g>
</svg>
