<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 195" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cert-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0B1224"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <!-- Animated Beams -->
    <linearGradient id="cert-beam-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#00F0FF;#10B981" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>

    <linearGradient id="cert-beam-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF">
        <animate attributeName="stop-color" values="#00F0FF;#8B5CF6;#00F0FF" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="cert-beam-3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B">
        <animate attributeName="stop-color" values="#F59E0B;#F97316;#F59E0B" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <style>
      .font-display { font-family: 'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'IBM Plex Mono', Menlo, Consolas, monospace; }
      .cert-title { font-weight: 700; font-size: 14.5px; fill: #F8FAFC; }
      .cert-sub { font-size: 11px; fill: #94A3B8; }
      .cert-tag { font-size: 10px; font-weight: 700; }
      
      @keyframes pulseBeacon {
        0% { r: 3px; opacity: 0.9; }
        100% { r: 10px; opacity: 0; }
      }
      .anim-beacon { animation: pulseBeacon 2s infinite cubic-bezier(0, 0.2, 0.8, 1); }
    </style>
  </defs>

  <rect width="1200" height="195" rx="14" fill="url(#cert-bg)" stroke="#1E293B" stroke-width="1.3"/>

  <!-- ================= Column 1: NPTEL Elite Certification ================= -->
  <g transform="translate(24, 18)">
    <rect width="365" height="158" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
    <rect x="0" y="0" width="365" height="3" rx="1.5" fill="url(#cert-beam-1)"/>
    
    <g transform="translate(18, 22)">
      <circle cx="5" cy="5" r="4" fill="#10B981"/>
      <circle cx="5" cy="5" r="4" fill="none" stroke="#10B981" stroke-width="1.2" class="anim-beacon"/>
      <text x="18" y="9" class="font-display cert-title">NPTEL Elite Certification</text>
    </g>
    <text x="18" y="52" class="font-mono cert-sub">IIT &amp; Ministry of Education · 2026</text>
    
    <line x1="18" y1="66" x2="347" y2="66" stroke="#1E293B" stroke-width="1"/>
    
    <text x="18" y="88" class="font-mono cert-sub">Course: <tspan fill="#F8FAFC" font-weight="600">Industry 4.0 &amp; Industrial IoT</tspan></text>
    <text x="18" y="108" class="font-mono cert-sub">Score: <tspan fill="#10B981" font-weight="700">64 / 100</tspan> · Classification: <tspan fill="#F59E0B" font-weight="700">🎖️ Elite</tspan></text>
    
    <g transform="translate(18, 122)">
      <rect width="145" height="22" rx="4" fill="#060913" stroke="#059669" stroke-width="1"/>
      <text x="72" y="15" text-anchor="middle" class="font-mono cert-tag" fill="#10B981">NPTEL ELITE CERTIFIED</text>
    </g>
  </g>

  <!-- ================= Column 2: B.Tech Computer Science Degree ================= -->
  <g transform="translate(413, 18)">
    <rect width="365" height="158" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
    <rect x="0" y="0" width="365" height="3" rx="1.5" fill="url(#cert-beam-2)"/>
    
    <g transform="translate(18, 22)">
      <circle cx="5" cy="5" r="4" fill="#00F0FF"/>
      <circle cx="5" cy="5" r="4" fill="none" stroke="#00F0FF" stroke-width="1.2" class="anim-beacon"/>
      <text x="18" y="9" class="font-display cert-title">B.Tech in Computer Science</text>
    </g>
    <text x="18" y="52" class="font-mono cert-sub">Vel Tech University, Chennai · 2024–2028</text>
    
    <line x1="18" y1="66" x2="347" y2="66" stroke="#1E293B" stroke-width="1"/>
    
    <text x="18" y="88" class="font-mono cert-sub">Student ID: <tspan fill="#00F0FF" font-weight="700">VTU29661</tspan> | Reg: <tspan fill="#F8FAFC" font-weight="600">24UECS0503</tspan></text>
    <text x="18" y="108" class="font-mono cert-sub">Cumulative Grade: <tspan fill="#00F0FF" font-weight="700">CGPA 8.6 / 10</tspan></text>
    
    <g transform="translate(18, 122)">
      <rect width="135" height="22" rx="4" fill="#060913" stroke="#0284C7" stroke-width="1"/>
      <text x="67" y="15" text-anchor="middle" class="font-mono cert-tag" fill="#00F0FF">3RD YEAR CSE '28</text>
    </g>
  </g>

  <!-- ================= Column 3: Intermediate Education ================= -->
  <g transform="translate(802, 18)">
    <rect width="374" height="158" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
    <rect x="0" y="0" width="374" height="3" rx="1.5" fill="url(#cert-beam-3)"/>
    
    <g transform="translate(18, 22)">
      <circle cx="5" cy="5" r="4" fill="#F59E0B"/>
      <circle cx="5" cy="5" r="4" fill="none" stroke="#F59E0B" stroke-width="1.2" class="anim-beacon"/>
      <text x="18" y="9" class="font-display cert-title">Intermediate (MPC Stream)</text>
    </g>
    <text x="18" y="52" class="font-mono cert-sub">Sri Chaitanya Jr. College, AP · 2022–2024</text>
    
    <line x1="18" y1="66" x2="356" y2="66" stroke="#1E293B" stroke-width="1"/>
    
    <text x="18" y="88" class="font-mono cert-sub">Focus: <tspan fill="#F8FAFC" font-weight="600">Maths, Physics, Chemistry (MPC)</tspan></text>
    <text x="18" y="108" class="font-mono cert-sub">Academic Score: <tspan fill="#F59E0B" font-weight="700">8.51 / 10 (85.1%)</tspan></text>
    
    <g transform="translate(18, 122)">
      <rect width="135" height="22" rx="4" fill="#060913" stroke="#D97706" stroke-width="1"/>
      <text x="67" y="15" text-anchor="middle" class="font-mono cert-tag" fill="#F59E0B">DISTINCTION</text>
    </g>
  </g>
</svg>
