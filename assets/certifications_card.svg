<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 195" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cert-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#121824"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>

    <!-- Animated Beams -->
    <linearGradient id="cert-beam-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#3FB950;#38BDF8" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#3FB950"/>
    </linearGradient>

    <linearGradient id="cert-beam-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8957E5">
        <animate attributeName="stop-color" values="#8957E5;#58A6FF;#8957E5" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#58A6FF"/>
    </linearGradient>

    <linearGradient id="cert-beam-3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D29922">
        <animate attributeName="stop-color" values="#D29922;#F59E0B;#D29922" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <style>
      .font-display { font-family: 'Inter', 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'IBM Plex Mono', Menlo, monospace; }
      .cert-title { font-weight: 700; font-size: 14.5px; fill: #F0F6FC; }
      .cert-sub { font-size: 11px; fill: #8B949E; }
      .cert-tag { font-size: 10px; font-weight: 700; }
      
      @keyframes pulseBeacon {
        0% { r: 3px; opacity: 0.8; }
        100% { r: 9px; opacity: 0; }
      }
      .anim-beacon { animation: pulseBeacon 2s infinite cubic-bezier(0, 0.2, 0.8, 1); }
    </style>
  </defs>

  <rect width="1200" height="195" rx="14" fill="url(#cert-bg)" stroke="#30363D" stroke-width="1.2"/>

  <!-- ================= Column 1: NPTEL Elite Certification ================= -->
  <g transform="translate(24, 18)">
    <rect width="365" height="158" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.1"/>
    <rect x="0" y="0" width="365" height="3" rx="1.5" fill="url(#cert-beam-1)"/>
    
    <g transform="translate(18, 22)">
      <circle cx="5" cy="5" r="4" fill="#3FB950"/>
      <circle cx="5" cy="5" r="4" fill="none" stroke="#3FB950" stroke-width="1" class="anim-beacon"/>
      <text x="18" y="9" class="font-display cert-title">NPTEL Elite Certification</text>
    </g>
    <text x="18" y="52" class="font-mono cert-sub">IIT &amp; Ministry of Education · 2026</text>
    
    <line x1="18" y1="66" x2="347" y2="66" stroke="#30363D" stroke-width="1"/>
    
    <text x="18" y="88" class="font-mono cert-sub">Domain: <tspan fill="#38BDF8" font-weight="700">Industry 4.0 &amp; Industrial IoT</tspan></text>
    <text x="18" y="108" class="font-mono cert-sub">Outcome: <tspan fill="#3FB950" font-weight="700">● Elite (Score: 64/100)</tspan></text>
    <text x="18" y="128" class="font-mono cert-sub">Focus: <tspan fill="#F0F6FC">Cyber-Physical Systems &amp; Sensors</tspan></text>

    <!-- Tag Pill -->
    <g transform="translate(18, 138)">
      <rect width="130" height="18" rx="4" fill="#0D1117" stroke="#30363D" stroke-width="0.9"/>
      <text x="65" y="12.5" text-anchor="middle" class="font-mono cert-tag" fill="#3FB950">IIT VERIFIED CREDENTIAL</text>
    </g>
  </g>

  <!-- ================= Column 2: Vel Tech University ================= -->
  <g transform="translate(413, 18)">
    <rect width="365" height="158" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.1"/>
    <rect x="0" y="0" width="365" height="3" rx="1.5" fill="url(#cert-beam-2)"/>
    
    <g transform="translate(18, 22)">
      <circle cx="5" cy="5" r="4" fill="#8957E5"/>
      <circle cx="5" cy="5" r="4" fill="none" stroke="#8957E5" stroke-width="1" class="anim-beacon"/>
      <text x="18" y="9" class="font-display cert-title">B.Tech in Computer Science</text>
    </g>
    <text x="18" y="52" class="font-mono cert-sub">Vel Tech University, Chennai · 2024–2028</text>
    
    <line x1="18" y1="66" x2="347" y2="66" stroke="#30363D" stroke-width="1"/>
    
    <text x="18" y="88" class="font-mono cert-sub">Academics: <tspan fill="#8957E5" font-weight="700">CGPA: 8.6 / 10</tspan> · Standing</text>
    <text x="18" y="108" class="font-mono cert-sub">Student ID: <tspan fill="#58A6FF" font-weight="600">VTU29661</tspan> · Reg: <tspan fill="#F0F6FC">24UECS0503</tspan></text>
    <text x="18" y="128" class="font-mono cert-sub">Key Tracks: <tspan fill="#F0F6FC">DSA, Java 21, Full-Stack, IoT</tspan></text>

    <!-- Tag Pill -->
    <g transform="translate(18, 138)">
      <rect width="130" height="18" rx="4" fill="#0D1117" stroke="#30363D" stroke-width="0.9"/>
      <text x="65" y="12.5" text-anchor="middle" class="font-mono cert-tag" fill="#58A6FF">CONSISTENT EXCELLENCE</text>
    </g>
  </g>

  <!-- ================= Column 3: Sri Chaitanya Junior College ================= -->
  <g transform="translate(802, 18)">
    <rect width="374" height="158" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.1"/>
    <rect x="0" y="0" width="374" height="3" rx="1.5" fill="url(#cert-beam-3)"/>
    
    <g transform="translate(18, 22)">
      <circle cx="5" cy="5" r="4" fill="#D29922"/>
      <circle cx="5" cy="5" r="4" fill="none" stroke="#D29922" stroke-width="1" class="anim-beacon"/>
      <text x="18" y="9" class="font-display cert-title">Intermediate — MPC</text>
    </g>
    <text x="18" y="52" class="font-mono cert-sub">Sri Chaitanya Junior College · AP Board</text>
    
    <line x1="18" y1="66" x2="356" y2="66" stroke="#30363D" stroke-width="1"/>
    
    <text x="18" y="88" class="font-mono cert-sub">Academics: <tspan fill="#D29922" font-weight="700">Score: 8.51 / 10</tspan></text>
    <text x="18" y="108" class="font-mono cert-sub">Discipline: <tspan fill="#F0F6FC">Maths, Physics &amp; Chemistry</tspan></text>
    <text x="18" y="128" class="font-mono cert-sub">Foundations: <tspan fill="#F0F6FC">Analytical Logic &amp; Calculus</tspan></text>

    <!-- Tag Pill -->
    <g transform="translate(18, 138)">
      <rect width="130" height="18" rx="4" fill="#0D1117" stroke="#30363D" stroke-width="0.9"/>
      <text x="65" y="12.5" text-anchor="middle" class="font-mono cert-tag" fill="#D29922">STRONG STEM BASE</text>
    </g>
  </g>
</svg>
