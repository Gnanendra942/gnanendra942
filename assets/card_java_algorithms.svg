<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-ja" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <style>
      .font-display { font-family: 'Inter', 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'IBM Plex Mono', Menlo, monospace; }
      .card-title { font-weight: 700; font-size: 18px; fill: #F8FAFC; }
      .card-desc { font-size: 11px; fill: #94A3B8; }
      .card-chip { font-size: 10px; font-weight: 600; }
    </style>
  </defs>

  <rect width="580" height="220" rx="12" fill="url(#bg-ja)" stroke="#1E293B" stroke-width="1.2"/>
  <rect x="0" y="0" width="580" height="2" rx="1" fill="#ED8B00"/>
  
  <!-- Status Badge -->
  <g transform="translate(415, 20)">
    <rect x="0" y="0" width="140" height="22" rx="4" fill="#141C2E" stroke="#1E293B" stroke-width="1"/>
    <circle cx="10" cy="11" r="3" fill="#ED8B00"/>
    <text x="20" y="15" class="font-mono card-chip" fill="#ED8B00">CORE JAVA &amp; DSA</text>
  </g>

  <!-- Title & Description -->
  <text x="24" y="42" class="font-display card-title">Problem Solving &amp; Testing Suite</text>
  <text x="24" y="78" class="font-mono card-desc">
    <tspan x="24" dy="0">• Applied coding algorithms, data structures &amp; test case verifications.</tspan>
    <tspan x="24" dy="18">• Optimized asymptotic complexity across arrays, trees, graphs &amp; dynamic sets.</tspan>
    <tspan x="24" dy="18">• Java 21 · Unit Testing · Object-Oriented Design · ACS Lab Suite</tspan>
  </text>

  <!-- Tech Tags -->
  <g transform="translate(24, 156)">
    <rect x="0" y="0" width="65" height="24" rx="4" fill="#141C2E" stroke="#1E293B" stroke-width="1"/>
    <text x="32" y="16" text-anchor="middle" class="font-mono card-chip" fill="#ED8B00">JAVA</text>

    <rect x="73" y="0" width="105" height="24" rx="4" fill="#141C2E" stroke="#1E293B" stroke-width="1"/>
    <text x="125" y="16" text-anchor="middle" class="font-mono card-chip" fill="#38BDF8">ALGORITHMS</text>

    <rect x="186" y="0" width="95" height="24" rx="4" fill="#141C2E" stroke="#1E293B" stroke-width="1"/>
    <text x="233" y="16" text-anchor="middle" class="font-mono card-chip" fill="#10B981">UNIT TESTS</text>
  </g>

  <!-- View Repo Link -->
  <g transform="translate(425, 156)">
    <rect x="0" y="0" width="130" height="24" rx="4" fill="#ED8B00"/>
    <text x="65" y="16" text-anchor="middle" class="font-display" font-size="10.5" font-weight="700" fill="#0B0F19">VIEW REPO ➔</text>
  </g>
</svg>
