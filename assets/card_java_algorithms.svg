<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-ja" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0B1224"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <linearGradient id="beam-ja" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B">
        <animate attributeName="stop-color" values="#F59E0B;#00F0FF;#8B5CF6;#F59E0B" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>

    <style>
      .font-display { font-family: 'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'IBM Plex Mono', Menlo, Consolas, monospace; }
      .card-title { font-weight: 700; font-size: 17px; fill: #F8FAFC; }
      .card-desc { font-size: 11px; fill: #94A3B8; }
      .card-chip { font-size: 10px; font-weight: 700; }

      @keyframes sortBar1 { 0%, 100% { height: 6px; y: 144px; } 50% { height: 16px; y: 134px; } }
      @keyframes sortBar2 { 0%, 100% { height: 16px; y: 134px; } 50% { height: 8px; y: 142px; } }
      @keyframes sortBar3 { 0%, 100% { height: 12px; y: 138px; } 50% { height: 18px; y: 132px; } }
      @keyframes sortBar4 { 0%, 100% { height: 18px; y: 132px; } 50% { height: 10px; y: 140px; } }
      @keyframes sortBar5 { 0%, 100% { height: 10px; y: 140px; } 50% { height: 14px; y: 136px; } }

      .sb-1 { animation: sortBar1 1s infinite ease-in-out; }
      .sb-2 { animation: sortBar2 1.3s infinite ease-in-out 0.1s; }
      .sb-3 { animation: sortBar3 1.1s infinite ease-in-out 0.2s; }
      .sb-4 { animation: sortBar4 1.4s infinite ease-in-out 0.3s; }
      .sb-5 { animation: sortBar5 1.2s infinite ease-in-out 0.15s; }

      @keyframes pulseNode {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.3); }
      }
      .anim-pulse-node { animation: pulseNode 2s infinite ease-in-out; transform-box: fill-box; transform-origin: center; }
    </style>
  </defs>

  <rect width="580" height="220" rx="12" fill="url(#bg-ja)" stroke="#1E293B" stroke-width="1.3"/>
  <rect x="0" y="0" width="580" height="3" rx="1.5" fill="url(#beam-ja)"/>
  
  <!-- Status Badge -->
  <g transform="translate(370, 18)">
    <rect width="185" height="24" rx="5" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#F59E0B" class="anim-pulse-node"/>
    <text x="22" y="16" class="font-mono card-chip" fill="#F59E0B">CORE JAVA 21 &amp; DSA</text>
  </g>

  <!-- Title & Description -->
  <text x="24" y="38" class="font-display card-title">Problem Solving &amp; Testing Suite</text>
  <text x="24" y="72" class="font-mono card-desc">
    <tspan x="24" dy="0">• Rigorous Java OOP testbench and automated algorithmic testing suite.</tspan>
    <tspan x="24" dy="18">• Data structures, dynamic programming, sorting trees &amp; recursion.</tspan>
    <tspan x="24" dy="18">• Java 21 · JUnit Testing · OOP Design Patterns · ACS Verification</tspan>
  </text>

  <!-- Live Animated Sorting Algorithm Visualizer -->
  <g transform="translate(24, 126)">
    <rect width="320" height="30" rx="4" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="14" y="20" class="font-mono" font-size="9.5" fill="#94A3B8">ALGO SIM: <tspan fill="#F59E0B">MERGE / HEAP SORT</tspan></text>
    
    <!-- Animated Bars -->
    <g transform="translate(195, -125)">
      <rect x="0" y="140" width="8" height="10" rx="2" fill="#F59E0B" class="sb-1"/>
      <rect x="12" y="136" width="8" height="14" rx="2" fill="#F59E0B" class="sb-2"/>
      <rect x="24" y="132" width="8" height="18" rx="2" fill="#F59E0B" class="sb-3"/>
      <rect x="36" y="142" width="8" height="8" rx="2" fill="#F59E0B" class="sb-4"/>
      <rect x="48" y="138" width="8" height="12" rx="2" fill="#F59E0B" class="sb-5"/>
      <rect x="60" y="134" width="8" height="16" rx="2" fill="#10B981" class="sb-1"/>
      <rect x="72" y="144" width="8" height="6" rx="2" fill="#00F0FF" class="sb-3"/>
      <rect x="84" y="132" width="8" height="18" rx="2" fill="#10B981" class="sb-2"/>
      <rect x="96" y="138" width="8" height="12" rx="2" fill="#00F0FF" class="sb-4"/>
    </g>
  </g>

  <!-- Tech Tags -->
  <g transform="translate(24, 172)">
    <rect width="75" height="26" rx="5" fill="#0F172A" stroke="#D97706" stroke-width="1"/>
    <text x="37" y="17" text-anchor="middle" class="font-mono card-chip" fill="#F59E0B">JAVA 21</text>

    <rect x="83" width="95" height="26" rx="5" fill="#0F172A" stroke="#0284C7" stroke-width="1"/>
    <text x="130" y="17" text-anchor="middle" class="font-mono card-chip" fill="#00F0FF">ALGORITHMS</text>

    <rect x="186" width="95" height="26" rx="5" fill="#0F172A" stroke="#059669" stroke-width="1"/>
    <text x="233" y="17" text-anchor="middle" class="font-mono card-chip" fill="#10B981">JUNIT / TEST</text>
  </g>

  <!-- View Repo Link -->
  <g transform="translate(425, 172)">
    <rect width="130" height="26" rx="5" fill="#D97706"/>
    <text x="65" y="17" text-anchor="middle" class="font-display" font-size="11" font-weight="700" fill="#FFFFFF">VIEW PROJECT ➔</text>
  </g>
</svg>
