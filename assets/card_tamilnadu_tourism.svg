<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="100%" height="100%">
  <defs>
    <!-- Deep Maroon-Obsidian Gradient -->
    <linearGradient id="tn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#240712"/>
      <stop offset="45%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>

    <!-- Animated Gold-Maroon Perimeter Border Beam -->
    <linearGradient id="tn-border-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37">
        <animate attributeName="stop-color" values="#D4AF37;#8A1538;#38BDF8;#D4AF37" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8A1538">
        <animate attributeName="stop-color" values="#8A1538;#38BDF8;#D4AF37;#8A1538" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Shimmering Golden Title Gradient -->
    <linearGradient id="tn-title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE699">
        <animate attributeName="stop-color" values="#FFE699;#FFFFFF;#D4AF37;#FFE699" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#FFFFFF">
        <animate attributeName="stop-color" values="#FFFFFF;#D4AF37;#FFE699;#FFFFFF" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#D4AF37">
        <animate attributeName="stop-color" values="#D4AF37;#FFE699;#FFFFFF;#D4AF37" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="tn-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .font-display { font-family: 'Inter', 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'IBM Plex Mono', Menlo, monospace; }

      @keyframes floatGopuram {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes radarPulse {
        0% { r: 3px; opacity: 1; }
        100% { r: 9px; opacity: 0; }
      }
      .anim-float { animation: floatGopuram 3.5s infinite ease-in-out; }
      .anim-radar { animation: radarPulse 2s infinite ease-out; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="1200" height="210" rx="14" fill="url(#tn-bg)" stroke="url(#tn-border-beam)" stroke-width="1.6"/>
  <rect x="0" y="0" width="1200" height="3" rx="1.5" fill="#D4AF37"/>

  <!-- Left Icon Frame with Glowing Temple Motifs -->
  <g transform="translate(36, 42)">
    <rect width="80" height="80" rx="16" fill="#141C2E" stroke="#8A1538" stroke-width="1.4" filter="url(#tn-glow)"/>
    <g class="anim-float" transform="translate(40, 52)">
      <text text-anchor="middle" font-size="38">🏛️</text>
    </g>
  </g>

  <!-- Title & Description (Center) -->
  <g transform="translate(140, 36)">
    <!-- Status Tag Pill -->
    <g transform="translate(0, 0)">
      <rect width="265" height="24" rx="5" fill="#141C2E" stroke="#1E293B" stroke-width="1"/>
      <circle cx="12" cy="12" r="3.5" fill="#10B981"/>
      <circle cx="12" cy="12" r="3.5" fill="none" stroke="#10B981" stroke-width="1" class="anim-radar"/>
      <text x="24" y="16" class="font-mono" font-size="10" font-weight="700" fill="#10B981">FEATURED SHOWCASE PROJECT</text>
      <text x="215" y="16" class="font-mono" font-size="9" font-weight="700" fill="#D4AF37">LIVE 60 FPS</text>
    </g>

    <!-- Main Title with Shimmering Gold Gradient -->
    <text x="0" y="54" class="font-display" font-size="24" font-weight="800" fill="url(#tn-title-grad)">
      Tamil Nadu Tourism — Interactive Discovery Platform
    </text>

    <!-- Subtitle / Architecture Highlights -->
    <text x="0" y="80" class="font-mono" font-size="12" fill="#38BDF8">
      Editorial travel discovery platform · 12 Heritage Destinations · 5 Geographic Zones · Vector Maps
    </text>
    <text x="0" y="100" class="font-mono" font-size="11.5" fill="#94A3B8">
      Pure Vanilla Web Engine · Zero Runtime Dependencies · Algorithmic Smart Trip Itinerary Planner
    </text>

    <!-- 4 Quick Feature Chips -->
    <g transform="translate(0, 120)">
      <rect width="135" height="24" rx="4" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
      <text x="67" y="16" text-anchor="middle" class="font-mono" font-size="9.5" font-weight="600" fill="#FFE699">🏛️ 12 CIRCUITS</text>

      <g transform="translate(145, 0)">
        <rect width="165" height="24" rx="4" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
        <text x="82" y="16" text-anchor="middle" class="font-mono" font-size="9.5" font-weight="600" fill="#38BDF8">🧭 TRIP PLANNER</text>
      </g>

      <g transform="translate(320, 0)">
        <rect width="150" height="24" rx="4" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
        <text x="75" y="16" text-anchor="middle" class="font-mono" font-size="9.5" font-weight="600" fill="#10B981">⚡ 0 DEPENDENCIES</text>
      </g>

      <g transform="translate(480, 0)">
        <rect width="130" height="24" rx="4" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
        <text x="65" y="16" text-anchor="middle" class="font-mono" font-size="9.5" font-weight="600" fill="#D4AF37">🌊 60 FPS FLUID</text>
      </g>
    </g>
  </g>

  <!-- Right Action Buttons -->
  <g transform="translate(950, 42)">
    <!-- Primary CTA: Live Demo -->
    <g>
      <rect width="210" height="38" rx="8" fill="#8A1538" stroke="#D4AF37" stroke-width="1.2" filter="url(#tn-glow)"/>
      <text x="105" y="24" text-anchor="middle" class="font-display" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">🚀 VISIT LIVE WEBSITE ➔</text>
    </g>

    <!-- Secondary CTA: GitHub Repo -->
    <g transform="translate(0, 48)">
      <rect width="210" height="36" rx="8" fill="#141C2E" stroke="#1E293B" stroke-width="1.2"/>
      <text x="105" y="23" text-anchor="middle" class="font-display" font-size="11.5" font-weight="700" fill="#38BDF8">📁 VIEW ON GITHUB ➔</text>
    </g>

    <!-- Verification Pill -->
    <g transform="translate(0, 94)">
      <rect width="210" height="22" rx="4" fill="#070B14" stroke="#1E293B" stroke-width="0.8"/>
      <circle cx="12" cy="11" r="3" fill="#10B981"/>
      <text x="24" y="15" class="font-mono" font-size="9" font-weight="600" fill="#94A3B8">DEPLOYED ON GITHUB PAGES</text>
    </g>
  </g>
</svg>
