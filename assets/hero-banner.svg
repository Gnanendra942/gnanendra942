<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="grad" x1="0" x2="1">
      <stop offset="0" stop-color="#8B5CF6" />
      <stop offset="1" stop-color="#036" />
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="1">
      <stop offset="0" stop-color="#00C6A7" />
      <stop offset="1" stop-color="#006AB3" />
    </linearGradient>
    <filter id="f1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="260" fill="#0d1117" />

  <!-- Animated gradient band -->
  <g filter="url(#f1)">
    <rect x="-400" y="30" width="1600" height="120" rx="16" fill="url(#grad)">
      <animate attributeName="x" dur="8s" values="-400; -200; 0; -400" repeatCount="indefinite" />
    </rect>
    <rect x="-500" y="54" width="1400" height="76" rx="12" fill="rgba(255,255,255,0.02)" />
  </g>

  <!-- Name and title -->
  <text x="60" y="120" fill="#fff" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="700">Chowreddygari Gnanendra Reddy</text>
  <text x="60" y="158" fill="#cbd5e1" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="18">Professional Software Developer — Scalable backends · API design · Distributed systems · Performance · Observability</text>

  <!-- small animated dots for subtle motion -->
  <g>
    <circle cx="1080" cy="60" r="6" fill="url(#glow)">
      <animate attributeName="cy" dur="3s" values="60;70;60" repeatCount="indefinite" />
      <animate attributeName="opacity" dur="3s" values="0.6;1;0.6" repeatCount="indefinite" />
    </circle>
    <circle cx="1120" cy="90" r="4" fill="#8B5CF6">
      <animate attributeName="cy" dur="4s" values="90;80;90" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- subtle divider line -->
  <line x1="60" y1="176" x2="1140" y2="176" stroke="rgba(255,255,255,0.03)" stroke-width="1" />

  <!-- CTA / badges drawn as text for reliability -->
  <text x="60" y="204" fill="#9ca3af" font-size="14">Open to opportunities • Chennai, India • B.Tech (CSE) — Vel Tech</text>

</svg>
