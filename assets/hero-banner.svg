<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Gnanendra Reddy hero banner</title>
  <desc id="desc">Professional software developer banner with a premium modern layout.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.5" stop-color="#111827"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.45" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0B1120" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>
  <circle cx="1080" cy="70" r="110" fill="#8B5CF6" opacity="0.18" filter="url(#blur)"/>
  <circle cx="980" cy="210" r="90" fill="#06B6D4" opacity="0.14" filter="url(#blur)"/>

  <g>
    <rect x="44" y="34" width="1112" height="192" rx="22" fill="url(#card)" stroke="rgba(148,163,184,0.18)"/>
    <rect x="60" y="50" width="470" height="8" rx="4" fill="url(#accent)"/>
    <rect x="60" y="76" width="300" height="4" rx="2" fill="#A78BFA" opacity="0.8"/>

    <text x="60" y="130" fill="#F8FAFC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="34" font-weight="700">Chowreddygari Gnanendra Reddy</text>
    <text x="60" y="166" fill="#CBD5E1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="500">Professional Software Developer • Backend Systems • API Design • Distributed Systems</text>

    <g>
      <rect x="60" y="186" width="132" height="22" rx="11" fill="url(#pill)"/>
      <text x="90" y="201" fill="#ECFDF5" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" font-weight="700">OPEN TO WORK</text>

      <rect x="206" y="186" width="180" height="22" rx="11" fill="#0F172A" stroke="rgba(148,163,184,0.2)"/>
      <text x="224" y="201" fill="#E2E8F0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" font-weight="600">Chennai, India</text>

      <rect x="400" y="186" width="214" height="22" rx="11" fill="#111827" stroke="rgba(139,92,246,0.35)"/>
      <text x="421" y="201" fill="#C4B5FD" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" font-weight="600">B.Tech (CSE) • Vel Tech</text>
    </g>
  </g>

  <g transform="translate(760 58)">
    <rect x="0" y="0" width="300" height="130" rx="18" fill="#0B1120" stroke="rgba(148,163,184,0.18)"/>
    <rect x="18" y="18" width="90" height="12" rx="6" fill="#8B5CF6" opacity="0.75"/>
    <rect x="18" y="40" width="130" height="8" rx="4" fill="#334155"/>
    <rect x="18" y="56" width="160" height="8" rx="4" fill="#334155"/>

    <path d="M26 100 L80 78 L116 86 L172 54 L220 65 L264 40" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="80" cy="78" r="5" fill="#22D3EE"/>
    <circle cx="172" cy="54" r="5" fill="#A78BFA"/>
    <circle cx="264" cy="40" r="5" fill="#34D399"/>

    <g fill="#94A3B8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10">
      <text x="22" y="118">Scalable systems</text>
      <text x="152" y="118">Product delivery</text>
    </g>
  </g>
</svg>
