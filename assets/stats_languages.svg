<svg width="495" height="220" viewBox="0 0 495 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <linearGradient id="langBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#00F0FF;#8B5CF6" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <linearGradient id="langShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.35">
        <animate attributeName="offset" values="0;1;0" dur="3.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes pulseDot {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.2); opacity: 1; }
      }
      .lang-dot { animation: pulseDot 2s infinite ease-in-out; transform-box: fill-box; transform-origin: center; }
    </style>
  </defs>

  <rect x="1" y="1" width="493" height="218" rx="12" fill="url(#bgGrad2)" stroke="#1E293B" stroke-width="1.2"/>
  <rect x="24" y="1" width="100" height="2.5" rx="1" fill="url(#langBeam)"/>

  <g transform="translate(24, 24)">
    <circle cx="5" cy="5" r="4" fill="#8B5CF6"/>
    <text x="16" y="9" font-family="'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" letter-spacing="0.5">MOST USED LANGUAGES</text>
    <text x="447" y="9" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="10" font-weight="600" fill="#94A3B8">BY CODE VOLUME</text>
  </g>

  <!-- Progress Bar Container with Sweep Shine -->
  <g transform="translate(24, 48)">
    <rect width="447" height="10" rx="5" fill="#0F172A"/>
    <rect x="0.0" y="0" width="392.5" height="10" fill="#EA580C" rx="2"/>
<rect x="392.5" y="0" width="32.2" height="10" fill="#38BDF8" rx="2"/>
<rect x="424.7" y="0" width="22.3" height="10" fill="#F59E0B" rx="2"/>

    <rect width="447" height="10" rx="5" fill="url(#langShine)"/>
  </g>

  <!-- Language List Grid -->
  <g transform="translate(24, 76)">
    
    <g transform="translate(0, 0)">
      <rect width="216" height="34" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <circle cx="16" cy="17" r="5" fill="#EA580C" class="lang-dot"/>
      <text x="30" y="21" font-family="'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#F8FAFC">HTML</text>
      <text x="202" y="21" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#EA580C">87.9%</text>
    </g>
    <g transform="translate(228, 0)">
      <rect width="216" height="34" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <circle cx="16" cy="17" r="5" fill="#38BDF8" class="lang-dot"/>
      <text x="30" y="21" font-family="'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#F8FAFC">Python</text>
      <text x="202" y="21" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#38BDF8">7.2%</text>
    </g>
    <g transform="translate(0, 42)">
      <rect width="216" height="34" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <circle cx="16" cy="17" r="5" fill="#F59E0B" class="lang-dot"/>
      <text x="30" y="21" font-family="'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#F8FAFC">Java</text>
      <text x="202" y="21" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', 'IBM Plex Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#F59E0B">5.0%</text>
    </g>
  </g>

  <text x="24" y="198" font-family="'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#64748B">Automated repository language analytics · Updated Daily</text>
</svg>