      <text x="30" y="21" font-family="'Inter', 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#F0F6FC">HTML</text>
      <text x="202" y="21" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', 'IBM Plex Mono', Menlo, monospace" font-size="11" font-weight="700" fill="#E34F26">49.5%</text>
    </g>
