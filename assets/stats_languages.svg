<svg width="495" height="220" viewBox="0 0 495 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="langBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8957E5">
        <animate attributeName="stop-color" values="#8957E5;#58A6FF;#8957E5" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#58A6FF"/>
    </linearGradient>
    <linearGradient id="langShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.35">
        <animate attributeName="offset" values="0;1;0" dur="3.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes pulseDot {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.2); opacity: 1; }
      }
      .lang-dot { animation: pulseDot 2s infinite ease-in-out; transform-box: fill-box; transform-origin: center; }
    </style>
  </defs>

  <rect x="1" y="1" width="493" height="218" rx="12" fill="url(#bgGrad2)" stroke="#30363D" stroke-width="1.2"/>
  <rect x="24" y="1" width="100" height="2.5" rx="1" fill="url(#langBeam)"/>

  <g transform="translate(24, 24)">
    <circle cx="5" cy="5" r="4" fill="#8957E5"/>
    <text x="16" y="9" font-family="'Inter', 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F0F6FC" letter-spacing="0.5">MOST USED LANGUAGES</text>
    <text x="447" y="9" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', 'IBM Plex Mono', Menlo, monospace" font-size="10" font-weight="600" fill="#8B949E">BY CODE VOLUME</text>
  </g>

  <!-- Progress Bar Container with Sweep Shine -->
  <g transform="translate(24, 48)">
    <rect width="447" height="10" rx="5" fill="#161B22"/>
    <rect x="0.0" y="0" width="221.0" height="10" fill="#E34F26" rx="2"/>
<rect x="221.0" y="0" width="138.9" height="10" fill="#38BDF8" rx="2"/>
<rect x="359.9" y="0" width="87.1" height="10" fill="#ED8B00" rx="2"/>
<rect x="447.0" y="0" width="0.0" height="10" fill="#F7DF1E" rx="2"/>

    <rect width="447" height="10" rx="5" fill="url(#langShine)"/>
  </g>

  <!-- Language List Grid -->
  <g transform="translate(24, 76)">
    
    <g transform="translate(0, 0)">
      <rect width="216" height="34" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
