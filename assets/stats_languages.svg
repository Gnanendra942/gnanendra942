      <text x="30" y="21" font-family="'Inter', 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#F0F6FC">JavaScript</text>
      <text x="202" y="21" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', 'IBM Plex Mono', Menlo, monospace" font-size="11" font-weight="700" fill="#F7DF1E">0.0%</text>
    </g>
  </g>

  <text x="24" y="198" font-family="'Inter', 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#6E7681">Automated repository language analytics · Updated Daily</text>
</svg>