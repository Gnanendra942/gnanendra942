<svg width="860" height="300" viewBox="0 0 860 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Developer Analytics Dashboard">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="barJava" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ED8B00"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="barWeb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#61DAFB"/>
      <stop offset="100%" stop-color="#7AF2FF"/>
    </linearGradient>
    <linearGradient id="barPy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3776AB"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="barIoT" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00979D"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <!-- Outer Frame -->
  <rect x="10" y="10" width="840" height="280" rx="20" fill="url(#cardGrad)" stroke="#7AF2FF" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Left Box: Activity & Telemetry Summary -->
  <g transform="translate(35, 30)">
    <rect x="0" y="0" width="370" height="235" rx="14" fill="#0D1117" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="24" y="38" fill="#7AF2FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">⚡ Developer Profile Summary</text>
    <line x1="24" y1="52" x2="346" y2="52" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Metric Rows -->
    <g transform="translate(24, 75)">
      <circle cx="6" cy="-4" r="4" fill="#7AF2FF"/>
      <text x="20" y="0" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Primary Focus:</text>
      <text x="200" y="0" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Java &amp; Full-Stack Web</text>
    </g>

    <g transform="translate(24, 110)">
      <circle cx="6" cy="-4" r="4" fill="#34D399"/>
      <text x="20" y="0" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Academic Program:</text>
      <text x="200" y="0" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">B.Tech CSE (VelTech)</text>
    </g>

    <g transform="translate(24, 145)">
      <circle cx="6" cy="-4" r="4" fill="#FBBF24"/>
      <text x="20" y="0" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Academic Year:</text>
      <text x="200" y="0" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">3rd Year (2024–2028)</text>
    </g>

    <g transform="translate(24, 180)">
      <circle cx="6" cy="-4" r="4" fill="#8B5CF6"/>
      <text x="20" y="0" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Specializations:</text>
      <text x="200" y="0" fill="#7AF2FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">IoT &amp; Smart Systems</text>
    </g>

    <g transform="translate(24, 215)">
      <circle cx="6" cy="-4" r="4" fill="#34D399"/>
      <text x="20" y="0" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Development Status:</text>
      <text x="200" y="0" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Active Explorer 🚀</text>
    </g>
  </g>

  <!-- Right Box: Language & Tech Distribution -->
  <g transform="translate(440, 30)">
    <rect x="0" y="0" width="380" height="235" rx="14" fill="#0D1117" stroke="#7AF2FF" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="24" y="38" fill="#7AF2FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">📈 Skill &amp; Technology Breakdown</text>
    <line x1="24" y1="52" x2="356" y2="52" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Progress Bar 1: Java -->
    <g transform="translate(24, 75)">
      <text x="0" y="0" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Java / OOP</text>
      <text x="330" y="0" fill="#ED8B00" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="end">45%</text>
      <rect x="0" y="8" width="330" height="7" rx="3.5" fill="#1E293B"/>
      <rect x="0" y="8" width="148" height="7" rx="3.5" fill="url(#barJava)"/>
    </g>

    <!-- Progress Bar 2: JavaScript & React -->
    <g transform="translate(24, 115)">
      <text x="0" y="0" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">JavaScript / React / Web</text>
      <text x="330" y="0" fill="#61DAFB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="end">30%</text>
      <rect x="0" y="8" width="330" height="7" rx="3.5" fill="#1E293B"/>
      <rect x="0" y="8" width="99" height="7" rx="3.5" fill="url(#barWeb)"/>
    </g>

    <!-- Progress Bar 3: Arduino & IoT -->
    <g transform="translate(24, 155)">
      <text x="0" y="0" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">IoT / Arduino / Sensors</text>
      <text x="330" y="0" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="end">15%</text>
      <rect x="0" y="8" width="330" height="7" rx="3.5" fill="#1E293B"/>
      <rect x="0" y="8" width="49" height="7" rx="3.5" fill="url(#barIoT)"/>
    </g>

    <!-- Progress Bar 4: SQL & Database -->
    <g transform="translate(24, 195)">
      <text x="0" y="0" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">SQL / DBMS Fundamentals</text>
      <text x="330" y="0" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="end">10%</text>
      <rect x="0" y="8" width="330" height="7" rx="3.5" fill="#1E293B"/>
      <rect x="0" y="8" width="33" height="7" rx="3.5" fill="url(#barPy)"/>
    </g>
  </g>
</svg>
