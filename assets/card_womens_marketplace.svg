<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-wm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>

    <linearGradient id="beam-wm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF">
        <animate attributeName="stop-color" values="#58A6FF;#8957E5;#58A6FF" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#3FB950"/>
    </linearGradient>

    <style>
      .font-display { font-family: 'Inter', 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'IBM Plex Mono', Menlo, monospace; }
      .card-title { font-weight: 700; font-size: 17px; fill: #F0F6FC; }
      .card-desc { font-size: 11px; fill: #8B949E; }
      .card-chip { font-size: 10px; font-weight: 700; }
      
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(1.4); }
      }
      .anim-dot { animation: pulseDot 2s infinite ease-in-out; transform-box: fill-box; transform-origin: center; }
    </style>
  </defs>

  <rect width="580" height="220" rx="12" fill="url(#bg-wm)" stroke="#30363D" stroke-width="1.2"/>
  <rect x="0" y="0" width="580" height="3" rx="1.5" fill="url(#beam-wm)"/>
  
  <!-- Status Badge -->
  <g transform="translate(370, 18)">
    <rect width="185" height="24" rx="5" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#3FB950" class="anim-dot"/>
    <text x="22" y="16" class="font-mono card-chip" fill="#3FB950">FLAGSHIP PLATFORM</text>
  </g>

  <!-- Title & Description -->
  <text x="24" y="38" class="font-display card-title">Women's Marketplace</text>
  <text x="24" y="72" class="font-mono card-desc">
    <tspan x="24" dy="0">• Empowering local women artisans through digital storefronts.</tspan>
    <tspan x="24" dy="18">• Real-time seller dashboard, stock tracking &amp; checkout workflows.</tspan>
    <tspan x="24" dy="18">• React · Node.js · Express · MongoDB · JWT Auth · Tailwind CSS</tspan>
  </text>

  <!-- Micro Architecture Diagram inside card -->
  <g transform="translate(24, 134)" opacity="0.8">
    <rect width="70" height="18" rx="3" fill="#161B22" stroke="#58A6FF" stroke-width="0.8"/>
    <text x="35" y="13" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#58A6FF">React UI</text>
    <line x1="72" y1="9" x2="88" y2="9" stroke="#58A6FF" stroke-width="1" stroke-dasharray="2 2"/>
    
    <rect x="90" width="80" height="18" rx="3" fill="#161B22" stroke="#8957E5" stroke-width="0.8"/>
    <text x="130" y="13" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8957E5">Express API</text>
    <line x1="172" y1="9" x2="188" y2="9" stroke="#8957E5" stroke-width="1" stroke-dasharray="2 2"/>
    
    <rect x="190" width="70" height="18" rx="3" fill="#161B22" stroke="#3FB950" stroke-width="0.8"/>
    <text x="225" y="13" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#3FB950">MongoDB</text>
  </g>

  <!-- Tech Tags -->
  <g transform="translate(24, 172)">
    <rect width="65" height="26" rx="5" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="32" y="17" text-anchor="middle" class="font-mono card-chip" fill="#58A6FF">REACT</text>

    <rect x="73" width="75" height="26" rx="5" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="110" y="17" text-anchor="middle" class="font-mono card-chip" fill="#3FB950">NODE.JS</text>

    <rect x="156" width="75" height="26" rx="5" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="193" y="17" text-anchor="middle" class="font-mono card-chip" fill="#8957E5">MONGODB</text>
  </g>

  <!-- View Repo Link -->
  <g transform="translate(425, 172)">
    <rect width="130" height="26" rx="5" fill="#2563EB"/>
    <text x="65" y="17" text-anchor="middle" class="font-display" font-size="11" font-weight="700" fill="#FFFFFF">VIEW PROJECT ➔</text>
  </g>
</svg>
